name: Release Core Binary
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: winsmux-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: winsmux-windows-arm64
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: ./.github/actions/setup-windows-distribution-toolchain
        with:
          targets: ${{ matrix.target }}
      - name: Build
        id: candidate
        shell: pwsh
        run: node scripts/build-core-candidate.mjs "${{ matrix.target }}" "$env:GITHUB_SHA" "$env:GITHUB_REF_NAME"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.candidate.outputs.artifact_path }}
          if-no-files-found: error

  build-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Package and test supported remote helper
        id: candidate
        run: node scripts/collect-core-candidates.mjs helper "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
      - name: Upload helper artifact
        uses: actions/upload-artifact@v7
        with:
          name: winsmux-remote-helper-linux-x64
          path: ${{ steps.candidate.outputs.artifact_path }}
          if-no-files-found: error

  release:
    needs: [build, build-helper]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Bootstrap repo hooks
        shell: pwsh
        run: ./scripts/bootstrap-git-guard.ps1
      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci
      - name: Check common contract package drift
        working-directory: winsmux-app
        run: npm run test:common-contract-package
      - name: Create Release Assets
        id: collection
        shell: pwsh
        run: node scripts/collect-core-candidates.mjs collect "$env:GITHUB_WORKSPACE/artifacts" "$env:GITHUB_SHA" "$env:GITHUB_REF_NAME" "$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
      - name: Generate Release Body
        shell: pwsh
        run: ./scripts/generate-release-notes.ps1 -Version "${{ github.ref_name }}" -OutputPath ".winsmux/build/core-release-body.md"
      - name: Check Release Body Quality
        shell: pwsh
        run: ./scripts/assert-release-notes-quality.ps1 -ReleaseNotesPath ".winsmux/build/core-release-body.md"
      - name: Audit Release Public Surface
        shell: pwsh
        run: ./scripts/audit-public-surface.ps1 -ReleaseNotesPath ".winsmux/build/core-release-body.md"
      - name: Stage final integrated Core artifact
        if: github.ref_name == 'v0.38.0'
        id: integrated
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .winsmux/build/ci-core-artifacts -ErrorAction Stop | Out-Null
          node scripts/stage-integrated-ci-artifact.mjs --surface core --source '${{ steps.collection.outputs.release_path }}' --release-body .winsmux/build/core-release-body.md --namespace .winsmux/build/ci-core-artifacts --source-commit "$env:GITHUB_SHA" --run-id "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Final integrated Core artifact staging failed.' }
      - name: Upload final integrated Core artifact
        if: github.ref_name == 'v0.38.0'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.integrated.outputs.artifact_name }}
          path: ${{ steps.integrated.outputs.artifact_path }}/
          if-no-files-found: error
      - name: Require integrated publication gate
        run: node scripts/assert-core-publication-ready.mjs
      - uses: softprops/action-gh-release@v3
        with:
          body_path: .winsmux/build/core-release-body.md
          files: ${{ steps.collection.outputs.release_path }}/*

  smoke-public-core:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Smoke public Core release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          ./scripts/test-public-release.ps1 -Surface Core -Version $version -ReleaseTag "${{ github.ref_name }}" -Repository "${{ github.repository }}" -Json
