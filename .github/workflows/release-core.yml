name: Release Core Binary
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: winsmux-windows-x64
          - target: aarch64-pc-windows-msvc
            artifact: winsmux-windows-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --manifest-path core/Cargo.toml --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/winsmux.exe

  build-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Package supported remote helper
        run: bash ./scripts/package-remote-helper.sh remote-helper-dist/winsmux-remote-helper-linux-x64
      - name: Test packaged remote helper
        run: bash ./scripts/test-public-remote-helper.sh remote-helper-dist/winsmux-remote-helper-linux-x64
      - name: Upload helper artifact
        uses: actions/upload-artifact@v7
        with:
          name: winsmux-remote-helper-linux-x64
          path: remote-helper-dist/winsmux-remote-helper-linux-x64

  release:
    needs: [build, build-helper]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json
      - uses: actions/download-artifact@v8
      - name: Bootstrap repo hooks
        shell: pwsh
        run: ./scripts/bootstrap-git-guard.ps1
      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci
      - name: Check common contract package drift
        working-directory: winsmux-app
        run: npm run test:common-contract-package
      - name: Create Release Assets
        run: |
          mkdir -p release
          cp winsmux-windows-x64/winsmux.exe release/winsmux-x64.exe
          cp winsmux-windows-arm64/winsmux.exe release/winsmux-arm64.exe
          cp winsmux-remote-helper-linux-x64/winsmux-remote-helper-linux-x64 release/winsmux-remote-helper-linux-x64
          cd release
          sha256sum winsmux-arm64.exe winsmux-remote-helper-linux-x64 winsmux-x64.exe > SHA256SUMS
      - name: Generate Release Body
        shell: pwsh
        run: ./scripts/generate-release-notes.ps1 -Version "${{ github.ref_name }}" -OutputPath "release/release-body.md"
      - name: Check Release Body Quality
        shell: pwsh
        run: ./scripts/assert-release-notes-quality.ps1 -ReleaseNotesPath "release/release-body.md"
      - name: Audit Release Public Surface
        shell: pwsh
        run: ./scripts/audit-public-surface.ps1 -ReleaseNotesPath "release/release-body.md"
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release/release-body.md
          files: release/*

  smoke-public-core:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Smoke public Core release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          ./scripts/test-public-release.ps1 -Surface Core -Version $version -ReleaseTag "${{ github.ref_name }}" -Repository "${{ github.repository }}" -Json
