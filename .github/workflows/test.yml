name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks Incremental Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.0"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run secret scan since recorded baseline
        shell: pwsh
        run: pwsh -NoProfile -File scripts/gitleaks-history.ps1

  public-surface:
    name: Public Surface Audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap repo hooks
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-git-guard.ps1

      - name: Assert hooks path
        shell: pwsh
        run: |
          $hooksPath = (git config --get core.hooksPath).Trim()
          if ($hooksPath -notmatch '(^|[\\/])\.githooks$') {
            throw "core.hooksPath must point to .githooks, got '$hooksPath'"
          }

      - name: Run git-guard
        shell: pwsh
        run: pwsh -NoProfile -File scripts/git-guard.ps1 -Mode full

      - name: Run public surface audit
        shell: pwsh
        run: pwsh -NoProfile -File scripts/audit-public-surface.ps1

  install-e2e:
    name: Fresh Install E2E (${{ matrix.route }})
    runs-on: windows-2025
    needs: public-surface
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        route: [Npm, Direct, DefectDetection]
    steps:
      - uses: actions/checkout@v6

      - name: Verify installer download targets
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assert-install-downloads-exist.ps1 -RepositoryRoot . -Treeish HEAD

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run fresh install route
        shell: pwsh
        env:
          WINSMUX_INSTALL_E2E_RELEASE_TAG: v0.36.28
          WINSMUX_INSTALL_E2E_GITHUB_ACCESS: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/test-install-e2e.ps1 -Route "${{ matrix.route }}" -RepositoryRoot . -SourceCommit "${{ github.sha }}"

  native-lifecycle-source:
    name: Native Lifecycle Source Boundary
    runs-on: windows-2025
    needs: public-surface
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate native binary
        run: cargo build --release --manifest-path core/Cargo.toml --bin winsmux

      - name: Reject hostile working-directory bridge selection
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-native-bridge-resolution.ps1 -CandidateBinary target/release/winsmux.exe

  common-contract-drift:
    name: Common Contract Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Check common contract package drift
        working-directory: winsmux-app
        run: npm run test:common-contract-package

      - name: Check automation driver pool
        working-directory: winsmux-app
        run: npm run test:automation-driver-pool

      - name: Check control plane bindings drift
        working-directory: winsmux-app
        run: npm run test:control-plane-bindings

      - name: Smoke control plane binding syntax
        working-directory: winsmux-app
        run: |
          set -euo pipefail
          ts_path="../sdk/typescript/control-plane-contract.ts"
          py_path="../sdk/python/control_plane_contract.py"
          if [ ! -f "$ts_path" ]; then echo "missing $ts_path" >&2; exit 1; fi
          if [ ! -f "$py_path" ]; then echo "missing $py_path" >&2; exit 1; fi
          node --experimental-strip-types --input-type=module -e "await import('../sdk/typescript/control-plane-contract.ts')"
          python3 -c "import importlib.util, pathlib, sys; p=pathlib.Path(r'$py_path'); spec=importlib.util.spec_from_file_location('control_plane_contract', p); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)"
          python3 -c "import importlib.util, pathlib; p=pathlib.Path('../sdk/examples/adapter-walkthrough.py'); spec=importlib.util.spec_from_file_location('adapter_walkthrough', p); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)"

  pester:
    name: Pester Tests (${{ matrix.name }})
    runs-on: windows-latest
    needs: public-surface
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bridge-foundation
            result: bridge-foundation
            timeout_minutes: 15
            paths: tests/bridge/Foundation.Tests.ps1;tests/bridge/Foundation.Settings.Tests.ps1
          - name: bridge-agent-orchestra
            result: bridge-agent-orchestra
            timeout_minutes: 20
            paths: tests/bridge/AgentOrchestra.Tests.ps1;tests/bridge/AgentOrchestra.Bootstrap.Tests.ps1
          - name: bridge-command-status
            result: bridge-command-status
            timeout_minutes: 12
            paths: tests/bridge/CommandStatus.Tests.ps1;tests/bridge/CommandStatus.RuntimeIdentity.Tests.ps1
          - name: bridge-worker-workspace-sandbox
            result: bridge-worker-workspace-sandbox
            timeout_minutes: 12
            paths: tests/bridge/WorkerWorkspaceSandbox.Tests.ps1
          - name: bridge-worker-broker-token
            result: bridge-worker-broker-token
            timeout_minutes: 12
            paths: tests/bridge/WorkerBrokerToken.Tests.ps1
          - name: bridge-worker-policy
            result: bridge-worker-policy
            timeout_minutes: 12
            paths: tests/bridge/WorkerPolicy.Tests.ps1
          - name: bridge-worker-secrets-status
            result: bridge-worker-secrets-status
            timeout_minutes: 12
            paths: tests/bridge/WorkerSecretsStatus.Tests.ps1
          - name: bridge-worker-heartbeat-start
            result: bridge-worker-heartbeat-start
            timeout_minutes: 12
            paths: tests/bridge/WorkerHeartbeatStart.Tests.ps1
          - name: bridge-worker-api-agy-exec
            result: bridge-worker-api-agy-exec
            timeout_minutes: 12
            paths: tests/bridge/WorkerApiAgyExec.Tests.ps1
          - name: bridge-command-queue-reporting
            result: bridge-command-queue-reporting
            timeout_minutes: 12
            paths: tests/bridge/CommandQueueReporting.Tests.ps1
          - name: bridge-command-review-dispatch
            result: bridge-command-review-dispatch
            timeout_minutes: 12
            paths: tests/bridge/CommandReviewDispatch.Tests.ps1
          - name: bridge-provider-commands
            result: bridge-provider-commands
            timeout_minutes: 15
            paths: tests/bridge/ProviderCommands.Tests.ps1;tests/bridge/ProviderCommands.Dispatch.Tests.ps1
          - name: bridge-artifacts-runtime
            result: bridge-artifacts-runtime
            timeout_minutes: 15
            paths: tests/bridge/ArtifactsRuntime.Tests.ps1;tests/bridge/ArtifactsRuntime.Operator.Tests.ps1
          - name: integration
            result: integration
            timeout_minutes: 30
            paths: tests/Integration.GateEnforcement.Tests.ps1;tests/Integration.MultiAgent.Tests.ps1;tests/Integration.PaneMonitorHook.Tests.ps1;tests/Integration.PluginHookLoader.Tests.ps1;tests/Integration.WorktreeHook.Tests.ps1;tests/Task839WorktreeReviewState.Tests.ps1;tests/V03630DesktopDebugGate.Tests.ps1;tests/DeclarativeWorkflow.Tests.ps1;tests/Task810PesterRunner.Tests.ps1;tests/Task800OperatorShellBoundary.Tests.ps1;tests/PesterGitIsolation.Tests.ps1;tests/Task811OperatorInfraGate.Tests.ps1
          - name: worker-benchmark
            result: worker-benchmark
            timeout_minutes: 20
            paths: tests/CliBakeoff.Tests.ps1;tests/HarnessContract.Tests.ps1;tests/Runtime.VaultInject.Tests.ps1
          - name: release-public
            result: release-public
            timeout_minutes: 20
            paths: tests/PublicSurfacePolicy.Tests.ps1;tests/VersionSurface.Tests.ps1;tests/NpmReleasePackage.Tests.ps1;tests/GitHubWritePreflight.Tests.ps1;tests/McpServerContract.Tests.ps1;tests/ThreatModelContract.Tests.ps1;tests/EnterpriseStrategyAlignment.Tests.ps1;tests/ReviewLatencyHardening.Tests.ps1;tests/UpstreamReevaluation.Tests.ps1
          - name: shell-support
            result: shell-support
            timeout_minutes: 15
            paths: tests/BuilderWorktree.Tests.ps1;tests/codex-subagent-worktree-guard.Tests.ps1;tests/OrchestraPreflight.Tests.ps1;tests/PaneBorder.Tests.ps1;tests/V03618ReleaseHardening.Tests.ps1;tests/AgentReadiness.Tests.ps1;tests/GitGuard.Tests.ps1
          - name: repo-audit-v03619
            result: repo-audit-v03619
            timeout_minutes: 12
            paths: tests/V03619RepoAudit.Tests.ps1
          - name: coordinator-v03620
            result: coordinator-v03620
            timeout_minutes: 12
            paths: tests/V03620CoordinatorFoundation.Tests.ps1
          - name: local-router-v03621
            result: local-router-v03621
            timeout_minutes: 12
            paths: tests/V03621LocalRouterShadow.Tests.ps1
          - name: desktop-split-v03626
            result: desktop-split-v03626
            timeout_minutes: 12
            paths: tests/V03626DesktopSplitGate.Tests.ps1
          - name: compat-performance-v03627
            result: compat-performance-v03627
            timeout_minutes: 12
            paths: tests/V03627CompatPerformanceGate.Tests.ps1;tests/Task781RuntimeCompatibility.Tests.ps1
          - name: race-abnormal-soak-v03628
            result: race-abnormal-soak-v03628
            timeout_minutes: 12
            paths: tests/V03628RaceAbnormalSoak.Tests.ps1
          - name: runtime-reliability-v03628
            result: runtime-reliability-v03628
            timeout_minutes: 12
            paths: tests/V03628RuntimeReliabilityGate.Tests.ps1
          - name: packaged-restore-v03628
            result: packaged-restore-v03628
            timeout_minutes: 12
            paths: tests/V03628PackagedRestoreGate.Tests.ps1
          - name: planning-model
            result: planning-model
            timeout_minutes: 5
            paths: tests/planning-model.Tests.ps1
    steps:
      - uses: actions/checkout@v6

      - name: Run Pester (${{ matrix.name }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shardId = '${{ matrix.name }}'
          $staticResultPath = 'test-results-${{ matrix.result }}.xml'
          $installUsed = $false
          if ($shardId -like 'bridge-*') {
            pwsh -NoProfile -File scripts/assert-pester-shard-coverage.ps1 | Write-Host
            if ($LASTEXITCODE -ne 0) {
              throw "Bridge shard coverage gate failed."
            }
          }
          # TASK810_CONSUMER_KERNEL_BEGIN
          $task810ExitCode = 2
          $task810Diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'
          $runnerCallThrew = $false
          $capture = $null
          try {
              $capture = @(& ./scripts/run-pester-shard.ps1 -ShardId $shardId)
          } catch {
              $runnerCallThrew = $true
              $capture = @()
          }
          function Test-Task810OrdinalMembership {
              param([string]$Value, $Set)
              if ($null -eq $Set) { return $false }
              try { $items = @($Set) } catch { return $false }
              foreach ($item in $items) {
                  if ($null -eq $item -or $item -isnot [string]) { continue }
                  if ([System.StringComparer]::Ordinal.Equals($Value, [string]$item)) { return $true }
              }
              return $false
          }
          function Test-Task810OrdinalStringSequence {
              param($Actual, $Expected)
              if ($null -eq $Actual -or $null -eq $Expected) { return $false }
              if ($Actual -is [string] -or $Expected -is [string]) { return $false }
              try {
                  $a = @($Actual)
                  $e = @($Expected)
              } catch { return $false }
              if ($a.Count -ne $e.Count) { return $false }
              for ($i = 0; $i -lt $e.Count; $i++) {
                  if ($null -eq $a[$i] -or $a[$i] -isnot [string]) { return $false }
                  if ($null -eq $e[$i] -or $e[$i] -isnot [string]) { return $false }
                  if (-not [System.StringComparer]::Ordinal.Equals([string]$a[$i], [string]$e[$i])) { return $false }
              }
              return $true
          }
          function Get-Task810ConsumerDecision {
              param(
                  [bool]$Threw,
                  $Capture,
                  [string]$ExpectedShardId,
                  [string]$ExpectedResultFile,
                  [bool]$InstallUsed
              )
              if ($Threw) {
                  return [pscustomobject]@{ code = 'C00'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($null -eq $Capture -or @($Capture).Count -ne 1 -or $Capture[0] -isnot [string] -or [string]::IsNullOrEmpty([string]$Capture[0])) {
                  return [pscustomobject]@{ code = 'C01'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $line = [string]$Capture[0]
              if ($line.Contains([char]10) -or $line.Contains([char]13)) {
                  return [pscustomobject]@{ code = 'C01'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              try { $envelope = $line | ConvertFrom-Json -ErrorAction Stop } catch {
                  return [pscustomobject]@{ code = 'C01'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $rootExpected = @('schema_version','shard_id','resolution_status','execution_status','test_outcome','failure_origin','workflow_action','pester_invoked','result_file','error_code','selected_module')
              $rootActual = @($envelope.PSObject.Properties.Name)
              if (-not (Test-Task810OrdinalStringSequence -Actual $rootActual -Expected $rootExpected)) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($envelope.schema_version -isnot [string] -or $envelope.schema_version -cne '1') {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              foreach ($key in @('shard_id','resolution_status','execution_status','test_outcome','failure_origin','workflow_action','result_file','error_code')) {
                  if ($envelope.$key -isnot [string]) {
                      return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
                  }
              }
              if ($envelope.pester_invoked -isnot [bool]) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($null -eq $envelope.selected_module) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $modExpected = @('present','name','semantic_version','manifest_path')
              $modActual = @($envelope.selected_module.PSObject.Properties.Name)
              if (-not (Test-Task810OrdinalStringSequence -Actual $modActual -Expected $modExpected)) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($envelope.selected_module.present -isnot [bool]) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              foreach ($key in @('name','semantic_version','manifest_path')) {
                  if ($envelope.selected_module.$key -isnot [string]) {
                      return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
                  }
              }
              if (-not [System.StringComparer]::Ordinal.Equals([string]$envelope.shard_id, $ExpectedShardId)) {
                  return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $rf = [string]$envelope.result_file
              if ($rf.Length -gt 0 -and -not [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile)) {
                  return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $mPresent = [bool]$envelope.selected_module.present
              if ($mPresent) {
                  if ($envelope.selected_module.name -cne 'Pester' -or $envelope.selected_module.semantic_version -cne '5.7.1' -or [string]::IsNullOrEmpty([string]$envelope.selected_module.manifest_path) -or [string]$envelope.resolution_status -cne 'resolved') {
                      return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
                  }
              } else {
                  if ($envelope.selected_module.name -cne '' -or $envelope.selected_module.semantic_version -cne '' -or $envelope.selected_module.manifest_path -cne '') {
                      return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
                  }
              }
              $rs = [string]$envelope.resolution_status
              $es = [string]$envelope.execution_status
              $to = [string]$envelope.test_outcome
              $fo = [string]$envelope.failure_origin
              $wa = [string]$envelope.workflow_action
              $pi = [bool]$envelope.pester_invoked
              $ec = [string]$envelope.error_code
              $isP04 = ($rs -ceq 'missing' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'install_once_then_rerun' -and -not $pi -and $ec -ceq 'pester_5_7_1_missing' -and -not $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP04) {
                  if (-not $InstallUsed) {
                      return [pscustomobject]@{ code = 'C04'; exit = 2; diagnostic = $null; install = $true; rerun = $true }
                  }
                  return [pscustomobject]@{ code = 'C06'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $isP16 = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'passed' -and $fo -ceq 'none' -and $wa -ceq 'succeed' -and $pi -and $ec -ceq 'none' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP16) {
                  if (Test-Path -LiteralPath $ExpectedResultFile) {
                      return [pscustomobject]@{ code = 'C07'; exit = 0; diagnostic = $null; install = $false; rerun = $false }
                  }
                  return [pscustomobject]@{ code = 'C08'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $failedOrigins = @('assertion','test_runtime','block_or_container','mixed')
              $isSuiteFail = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'failed' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_tests_failed' -and $mPresent -and (Test-Task810OrdinalMembership -Value $fo -Set $failedOrigins) -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isSuiteFail) {
                  if (Test-Path -LiteralPath $ExpectedResultFile) {
                      return [pscustomobject]@{ code = 'C09'; exit = 1; diagnostic = 'TASK810_TEST_FAILURE'; install = $false; rerun = $false }
                  }
                  return [pscustomobject]@{ code = 'C10'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $isP11 = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'passed' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_result_file_missing' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP12to15 = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'failed' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_result_file_missing' -and $mPresent -and (Test-Task810OrdinalMembership -Value $fo -Set $failedOrigins) -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP11 -or $isP12to15) {
                  return [pscustomobject]@{ code = 'C11'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $isP00 = ($rs -ceq 'unknown' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'shard_id_unknown' -and -not $mPresent -and $rf -ceq '')
              $isP01 = ($rs -ceq 'empty' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'shard_id_empty' -and -not $mPresent -and $rf -ceq '')
              $isP02 = ($rs -ceq 'duplicate' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'shard_registry_duplicate' -and -not $mPresent -and $rf -ceq '')
              $isP03 = ($rs -ceq 'artifact_conflict' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'preexisting_result_file' -and -not $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP05 = ($rs -ceq 'ambiguous' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'pester_5_7_1_ambiguous' -and -not $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP06 = ($rs -ceq 'runtime_failure' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'resolver_runtime_failure' -and -not $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP07 = ($rs -ceq 'resolved' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'pester_import_failure' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP08 = ($rs -ceq 'resolved' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'pester_configuration_failure' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP00 -or $isP01 -or $isP02 -or $isP03 -or $isP05 -or $isP06 -or $isP07 -or $isP08) {
                  return [pscustomobject]@{ code = 'C12'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $isP09 = ($rs -ceq 'resolved' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_runtime_failure' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP10 = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_result_invalid' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP09 -or $isP10) {
                  return [pscustomobject]@{ code = 'C13'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
          }

          $decision = Get-Task810ConsumerDecision -Threw:$runnerCallThrew -Capture $capture -ExpectedShardId $shardId -ExpectedResultFile $staticResultPath -InstallUsed:$installUsed
          if ([bool]$decision.install) {
              try {
                  $repo = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
                  if (-not $repo) { Register-PSRepository -Default -ErrorAction Stop }
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                  Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1 -Repository PSGallery -ErrorAction Stop
                  $installUsed = $true
              } catch {
                  $task810ExitCode = 2
                  $task810Diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'
                  $decision = [pscustomobject]@{ code = 'C05'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($installUsed) {
                  $runnerCallThrew = $false
                  $capture = $null
                  try {
                      $capture = @(& ./scripts/run-pester-shard.ps1 -ShardId $shardId)
                  } catch {
                      $runnerCallThrew = $true
                      $capture = @()
                  }
                  $decision = Get-Task810ConsumerDecision -Threw:$runnerCallThrew -Capture $capture -ExpectedShardId $shardId -ExpectedResultFile $staticResultPath -InstallUsed:$installUsed
              }
          }
          $task810ExitCode = [int]$decision.exit
          if ($null -ne $decision.diagnostic) { $task810Diagnostic = [string]$decision.diagnostic } else { $task810Diagnostic = $null }
          # TASK810_CONSUMER_KERNEL_END
          if ($null -ne $task810Diagnostic) {
            Write-Host $task810Diagnostic
          }
          exit $task810ExitCode

      - name: Upload test results
        if: ${{ always() && hashFiles(format('test-results-{0}.xml', matrix.result)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.result }}
          path: test-results-${{ matrix.result }}.xml

  core-build-test:
    name: Core Build and Test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build core
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Test core
        run: cargo test --manifest-path core/Cargo.toml

  desktop-build-test:
    name: Desktop Build and Test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Build frontend
        working-directory: winsmux-app
        run: npm run build

      - name: Stage companion CLI sidecar
        working-directory: winsmux-app
        run: npm run prepare:companion-cli

      - name: Test Tauri backend
        run: cargo test --manifest-path winsmux-app/src-tauri/Cargo.toml

      - name: Build desktop binary without bundling
        working-directory: winsmux-app
        run: npm run tauri -- build --no-bundle

      - name: Run V03630 desktop debug process gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shardId = 'desktop-debug-process'
          $staticResultPath = 'test-results-desktop-debug-v03630.xml'
          $installUsed = $false
          $appPath = (Resolve-Path -LiteralPath 'target/release/winsmux-app.exe' -ErrorAction Stop).ProviderPath
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          try {
            $listener.Start()
            $debugPort = ([Net.IPEndPoint]$listener.LocalEndpoint).Port
          } finally {
            $listener.Stop()
          }
          if ($debugPort -lt 1024 -or $debugPort -gt 65535) {
            throw "Allocated debug port is outside 1024..65535: $debugPort"
          }
          $env:WINSMUX_DBGGATE_APP_EXE = $appPath
          $env:WINSMUX_DBGGATE_PORT = [string]$debugPort
          try {
          # TASK810_CONSUMER_KERNEL_BEGIN
          $task810ExitCode = 2
          $task810Diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'
          $runnerCallThrew = $false
          $capture = $null
          try {
              $capture = @(& ./scripts/run-pester-shard.ps1 -ShardId $shardId)
          } catch {
              $runnerCallThrew = $true
              $capture = @()
          }
          function Test-Task810OrdinalMembership {
              param([string]$Value, $Set)
              if ($null -eq $Set) { return $false }
              try { $items = @($Set) } catch { return $false }
              foreach ($item in $items) {
                  if ($null -eq $item -or $item -isnot [string]) { continue }
                  if ([System.StringComparer]::Ordinal.Equals($Value, [string]$item)) { return $true }
              }
              return $false
          }
          function Test-Task810OrdinalStringSequence {
              param($Actual, $Expected)
              if ($null -eq $Actual -or $null -eq $Expected) { return $false }
              if ($Actual -is [string] -or $Expected -is [string]) { return $false }
              try {
                  $a = @($Actual)
                  $e = @($Expected)
              } catch { return $false }
              if ($a.Count -ne $e.Count) { return $false }
              for ($i = 0; $i -lt $e.Count; $i++) {
                  if ($null -eq $a[$i] -or $a[$i] -isnot [string]) { return $false }
                  if ($null -eq $e[$i] -or $e[$i] -isnot [string]) { return $false }
                  if (-not [System.StringComparer]::Ordinal.Equals([string]$a[$i], [string]$e[$i])) { return $false }
              }
              return $true
          }
          function Get-Task810ConsumerDecision {
              param(
                  [bool]$Threw,
                  $Capture,
                  [string]$ExpectedShardId,
                  [string]$ExpectedResultFile,
                  [bool]$InstallUsed
              )
              if ($Threw) {
                  return [pscustomobject]@{ code = 'C00'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($null -eq $Capture -or @($Capture).Count -ne 1 -or $Capture[0] -isnot [string] -or [string]::IsNullOrEmpty([string]$Capture[0])) {
                  return [pscustomobject]@{ code = 'C01'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $line = [string]$Capture[0]
              if ($line.Contains([char]10) -or $line.Contains([char]13)) {
                  return [pscustomobject]@{ code = 'C01'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              try { $envelope = $line | ConvertFrom-Json -ErrorAction Stop } catch {
                  return [pscustomobject]@{ code = 'C01'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $rootExpected = @('schema_version','shard_id','resolution_status','execution_status','test_outcome','failure_origin','workflow_action','pester_invoked','result_file','error_code','selected_module')
              $rootActual = @($envelope.PSObject.Properties.Name)
              if (-not (Test-Task810OrdinalStringSequence -Actual $rootActual -Expected $rootExpected)) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($envelope.schema_version -isnot [string] -or $envelope.schema_version -cne '1') {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              foreach ($key in @('shard_id','resolution_status','execution_status','test_outcome','failure_origin','workflow_action','result_file','error_code')) {
                  if ($envelope.$key -isnot [string]) {
                      return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
                  }
              }
              if ($envelope.pester_invoked -isnot [bool]) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($null -eq $envelope.selected_module) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $modExpected = @('present','name','semantic_version','manifest_path')
              $modActual = @($envelope.selected_module.PSObject.Properties.Name)
              if (-not (Test-Task810OrdinalStringSequence -Actual $modActual -Expected $modExpected)) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($envelope.selected_module.present -isnot [bool]) {
                  return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              foreach ($key in @('name','semantic_version','manifest_path')) {
                  if ($envelope.selected_module.$key -isnot [string]) {
                      return [pscustomobject]@{ code = 'C02'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
                  }
              }
              if (-not [System.StringComparer]::Ordinal.Equals([string]$envelope.shard_id, $ExpectedShardId)) {
                  return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $rf = [string]$envelope.result_file
              if ($rf.Length -gt 0 -and -not [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile)) {
                  return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $mPresent = [bool]$envelope.selected_module.present
              if ($mPresent) {
                  if ($envelope.selected_module.name -cne 'Pester' -or $envelope.selected_module.semantic_version -cne '5.7.1' -or [string]::IsNullOrEmpty([string]$envelope.selected_module.manifest_path) -or [string]$envelope.resolution_status -cne 'resolved') {
                      return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
                  }
              } else {
                  if ($envelope.selected_module.name -cne '' -or $envelope.selected_module.semantic_version -cne '' -or $envelope.selected_module.manifest_path -cne '') {
                      return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
                  }
              }
              $rs = [string]$envelope.resolution_status
              $es = [string]$envelope.execution_status
              $to = [string]$envelope.test_outcome
              $fo = [string]$envelope.failure_origin
              $wa = [string]$envelope.workflow_action
              $pi = [bool]$envelope.pester_invoked
              $ec = [string]$envelope.error_code
              $isP04 = ($rs -ceq 'missing' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'install_once_then_rerun' -and -not $pi -and $ec -ceq 'pester_5_7_1_missing' -and -not $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP04) {
                  if (-not $InstallUsed) {
                      return [pscustomobject]@{ code = 'C04'; exit = 2; diagnostic = $null; install = $true; rerun = $true }
                  }
                  return [pscustomobject]@{ code = 'C06'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $isP16 = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'passed' -and $fo -ceq 'none' -and $wa -ceq 'succeed' -and $pi -and $ec -ceq 'none' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP16) {
                  if (Test-Path -LiteralPath $ExpectedResultFile) {
                      return [pscustomobject]@{ code = 'C07'; exit = 0; diagnostic = $null; install = $false; rerun = $false }
                  }
                  return [pscustomobject]@{ code = 'C08'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $failedOrigins = @('assertion','test_runtime','block_or_container','mixed')
              $isSuiteFail = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'failed' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_tests_failed' -and $mPresent -and (Test-Task810OrdinalMembership -Value $fo -Set $failedOrigins) -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isSuiteFail) {
                  if (Test-Path -LiteralPath $ExpectedResultFile) {
                      return [pscustomobject]@{ code = 'C09'; exit = 1; diagnostic = 'TASK810_TEST_FAILURE'; install = $false; rerun = $false }
                  }
                  return [pscustomobject]@{ code = 'C10'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $isP11 = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'passed' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_result_file_missing' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP12to15 = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'failed' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_result_file_missing' -and $mPresent -and (Test-Task810OrdinalMembership -Value $fo -Set $failedOrigins) -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP11 -or $isP12to15) {
                  return [pscustomobject]@{ code = 'C11'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $isP00 = ($rs -ceq 'unknown' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'shard_id_unknown' -and -not $mPresent -and $rf -ceq '')
              $isP01 = ($rs -ceq 'empty' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'shard_id_empty' -and -not $mPresent -and $rf -ceq '')
              $isP02 = ($rs -ceq 'duplicate' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'shard_registry_duplicate' -and -not $mPresent -and $rf -ceq '')
              $isP03 = ($rs -ceq 'artifact_conflict' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'preexisting_result_file' -and -not $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP05 = ($rs -ceq 'ambiguous' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'pester_5_7_1_ambiguous' -and -not $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP06 = ($rs -ceq 'runtime_failure' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'resolver_runtime_failure' -and -not $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP07 = ($rs -ceq 'resolved' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'pester_import_failure' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP08 = ($rs -ceq 'resolved' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and -not $pi -and $ec -ceq 'pester_configuration_failure' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP00 -or $isP01 -or $isP02 -or $isP03 -or $isP05 -or $isP06 -or $isP07 -or $isP08) {
                  return [pscustomobject]@{ code = 'C12'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              $isP09 = ($rs -ceq 'resolved' -and $es -ceq 'not_started' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_runtime_failure' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              $isP10 = ($rs -ceq 'resolved' -and $es -ceq 'completed' -and $to -ceq 'not_run' -and $fo -ceq 'none' -and $wa -ceq 'fail' -and $pi -and $ec -ceq 'pester_result_invalid' -and $mPresent -and [System.StringComparer]::Ordinal.Equals($rf, $ExpectedResultFile))
              if ($isP09 -or $isP10) {
                  return [pscustomobject]@{ code = 'C13'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              return [pscustomobject]@{ code = 'C03'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
          }

          $decision = Get-Task810ConsumerDecision -Threw:$runnerCallThrew -Capture $capture -ExpectedShardId $shardId -ExpectedResultFile $staticResultPath -InstallUsed:$installUsed
          if ([bool]$decision.install) {
              try {
                  $repo = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
                  if (-not $repo) { Register-PSRepository -Default -ErrorAction Stop }
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                  Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1 -Repository PSGallery -ErrorAction Stop
                  $installUsed = $true
              } catch {
                  $task810ExitCode = 2
                  $task810Diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'
                  $decision = [pscustomobject]@{ code = 'C05'; exit = 2; diagnostic = 'TASK810_RUNNER_PROTOCOL_FAILURE'; install = $false; rerun = $false }
              }
              if ($installUsed) {
                  $runnerCallThrew = $false
                  $capture = $null
                  try {
                      $capture = @(& ./scripts/run-pester-shard.ps1 -ShardId $shardId)
                  } catch {
                      $runnerCallThrew = $true
                      $capture = @()
                  }
                  $decision = Get-Task810ConsumerDecision -Threw:$runnerCallThrew -Capture $capture -ExpectedShardId $shardId -ExpectedResultFile $staticResultPath -InstallUsed:$installUsed
              }
          }
          $task810ExitCode = [int]$decision.exit
          if ($null -ne $decision.diagnostic) { $task810Diagnostic = [string]$decision.diagnostic } else { $task810Diagnostic = $null }
          # TASK810_CONSUMER_KERNEL_END
          } finally {
            Remove-Item Env:WINSMUX_DBGGATE_APP_EXE -ErrorAction SilentlyContinue
            Remove-Item Env:WINSMUX_DBGGATE_PORT -ErrorAction SilentlyContinue
          }
          if ($null -ne $task810Diagnostic) {
            Write-Host $task810Diagnostic
          }
          exit $task810ExitCode

      - name: Upload V03630 desktop debug process results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-desktop-debug-v03630
          path: test-results-desktop-debug-v03630.xml
          if-no-files-found: ignore

  desktop-nsis-lifecycle:
    name: Desktop NSIS Fresh and Upgrade Lifecycle
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Build candidate NSIS installer from the tested commit
        working-directory: winsmux-app
        run: npm run tauri -- build --bundles nsis

      - name: Download, verify, and stage lifecycle installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/task679-nsis-lifecycle'
          $evidencePath = Join-Path $artifactRoot 'evidence.json'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $version = (Get-Content -LiteralPath 'VERSION' -Raw -Encoding UTF8).Trim()
          $priorVersion = '0.36.33'
          $priorTag = 'v0.36.33'
          $priorAsset = 'winsmux_0.36.33_x64-setup.exe'
          $priorExpectedHash = '011df20edc393299172c0e48a4584a0b99d441b7848c493d7f4b7e37339f55e9'
          $candidateAsset = "winsmux_${version}_x64-setup.exe"
          $evidence = [ordered]@{
            schema_version = 'task679-nsis-lifecycle-v1'
            source_commit = '${{ github.sha }}'
            outcome = 'pending'
            failure_stage = ''
            inputs = [ordered]@{
              candidate = [ordered]@{ version = $version; asset = $candidateAsset; sha256 = '' }
              prior = [ordered]@{ version = $priorVersion; tag = $priorTag; asset = $priorAsset; sha256 = ''; expected_sha256 = $priorExpectedHash }
            }
            stages = [ordered]@{
              build = [ordered]@{ exit_code = 0; command = 'npm run tauri -- build --bundles nsis'; artifact_verified = $false }
              prior_download = [ordered]@{ exit_code = $null; artifact_found = $false; sha256_verified = $false }
              staging = [ordered]@{ exit_code = $null; candidate_staged = $false; prior_staged = $false }
              network_isolation = [ordered]@{ exit_code = $null; rule_enabled = $false; positive_control_exit_code = $null; positive_control_blocked = $false }
              network_restore = [ordered]@{ exit_code = $null; rule_absent = $false }
            }
            protected_inventory = [ordered]@{ before = @() }
            legs = [ordered]@{
              fresh = [ordered]@{ status = 'pending' }
              upgrade = [ordered]@{ status = 'pending' }
            }
          }
          function Write-Task679Evidence {
            $json = $evidence | ConvertTo-Json -Depth 12
            [IO.File]::WriteAllText($evidencePath, $json, [Text.UTF8Encoding]::new($false))
          }
          Write-Task679Evidence

          $stage = 'candidate_artifact'
          try {
            $candidateSource = Join-Path $env:GITHUB_WORKSPACE "target/release/bundle/nsis/$candidateAsset"
            if (-not (Test-Path -LiteralPath $candidateSource -PathType Leaf)) {
              throw "Candidate NSIS installer was not found at its version-derived bundle path."
            }
            $evidence.stages.build.artifact_verified = $true

            $stageRoot = Join-Path $env:RUNNER_TEMP 'winsmux-task679-stage'
            $protectedRoot = Join-Path $env:RUNNER_TEMP 'winsmux-task679-protected'
            New-Item -ItemType Directory -Path $stageRoot, $protectedRoot -Force | Out-Null
            $candidatePath = Join-Path $stageRoot $candidateAsset
            $priorPath = Join-Path $stageRoot $priorAsset
            Copy-Item -LiteralPath $candidateSource -Destination $candidatePath

            $stage = 'prior_download'
            $priorUrl = "https://github.com/${{ github.repository }}/releases/download/$priorTag/$priorAsset"
            & curl.exe --fail --location --silent --show-error --output $priorPath $priorUrl
            $priorDownloadExit = [int]$LASTEXITCODE
            $evidence.stages.prior_download.exit_code = $priorDownloadExit
            $evidence.stages.prior_download.artifact_found = Test-Path -LiteralPath $priorPath -PathType Leaf
            Write-Task679Evidence
            if ($priorDownloadExit -ne 0 -or -not $evidence.stages.prior_download.artifact_found) {
              throw 'Pinned prior NSIS installer download failed or produced no file.'
            }

            $stage = 'checksum_verification'
            $candidateHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $priorHash = (Get-FileHash -LiteralPath $priorPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $evidence.inputs.candidate.sha256 = $candidateHash
            $evidence.inputs.prior.sha256 = $priorHash
            $evidence.stages.prior_download.sha256_verified = [string]::Equals($priorHash, $priorExpectedHash, [StringComparison]::Ordinal)
            if (-not $evidence.stages.prior_download.sha256_verified) {
              Write-Task679Evidence
              throw 'Pinned prior NSIS installer SHA-256 did not match SHA256SUMS-desktop evidence.'
            }

            $stage = 'protected_inventory'
            $protectedDefinitions = @(
              [pscustomobject]@{ label = 'project_repo'; file = 'project-repo/sentinel.bin'; content = 'task679-project-repo' },
              [pscustomobject]@{ label = 'agent_cli'; file = 'agent-cli/sentinel.bin'; content = 'task679-agent-cli' },
              [pscustomobject]@{ label = 'non_owned_state'; file = 'non-owned/sentinel.bin'; content = 'task679-non-owned-state' }
            )
            $protectedBefore = [Collections.Generic.List[object]]::new()
            foreach ($definition in $protectedDefinitions) {
              $path = Join-Path $protectedRoot $definition.file
              New-Item -ItemType Directory -Path (Split-Path -Parent $path) -Force | Out-Null
              [IO.File]::WriteAllText($path, $definition.content, [Text.UTF8Encoding]::new($false))
              $protectedBefore.Add([ordered]@{
                label = [string]$definition.label
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              })
            }
            $evidence.protected_inventory.before = @($protectedBefore)
            $evidence.stages.staging = [ordered]@{ exit_code = 0; candidate_staged = $true; prior_staged = $true }
            Write-Task679Evidence

            $firewallRule = "winsmux-task679-outbound-${{ github.run_id }}-${{ github.run_attempt }}"
            $environmentLines = @(
              "TASK679_CANDIDATE_PATH=$candidatePath",
              "TASK679_CANDIDATE_HASH=$candidateHash",
              "TASK679_CANDIDATE_ASSET=$candidateAsset",
              "TASK679_VERSION=$version",
              "TASK679_PRIOR_PATH=$priorPath",
              "TASK679_PRIOR_HASH=$priorHash",
              "TASK679_PRIOR_VERSION=$priorVersion",
              "TASK679_PROTECTED_ROOT=$protectedRoot",
              "TASK679_EVIDENCE_PATH=$evidencePath",
              "TASK679_FIREWALL_RULE=$firewallRule"
            )
            [IO.File]::AppendAllText($env:GITHUB_ENV, (($environmentLines -join [Environment]::NewLine) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          } catch {
            $evidence.outcome = 'fail'
            $evidence.failure_stage = $stage
            Write-Task679Evidence
            throw
          }

      - name: Deny runner outbound network and prove isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Get-Content -LiteralPath $env:TASK679_EVIDENCE_PATH -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable -Depth 12
          function Write-Task679Evidence {
            [IO.File]::WriteAllText($env:TASK679_EVIDENCE_PATH, ($evidence | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
          }
          try {
            if (Get-NetFirewallRule -Name $env:TASK679_FIREWALL_RULE -ErrorAction SilentlyContinue) {
              throw 'Run-scoped TASK-679 firewall rule already exists.'
            }
            New-NetFirewallRule -Name $env:TASK679_FIREWALL_RULE -DisplayName $env:TASK679_FIREWALL_RULE -Direction Outbound -Action Block -Enabled True -Profile Any -RemoteAddress Any | Out-Null
            $rule = @(Get-NetFirewallRule -Name $env:TASK679_FIREWALL_RULE -ErrorAction Stop)
            $ruleEnabled = $rule.Count -eq 1 -and [string]$rule[0].Enabled -ceq 'True' -and [string]$rule[0].Direction -ceq 'Outbound' -and [string]$rule[0].Action -ceq 'Block'

            $curlStdout = Join-Path $env:RUNNER_TEMP 'task679-network-control.stdout'
            $curlStderr = Join-Path $env:RUNNER_TEMP 'task679-network-control.stderr'
            $control = Start-Process -FilePath 'curl.exe' -ArgumentList @('--fail', '--silent', '--show-error', 'https://github.com/') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $curlStdout -RedirectStandardError $curlStderr
            $controlBlocked = $control.ExitCode -ne 0
            $evidence.stages.network_isolation = [ordered]@{
              exit_code = if ($ruleEnabled -and $controlBlocked) { 0 } else { 1 }
              rule_enabled = $ruleEnabled
              positive_control_exit_code = [int]$control.ExitCode
              positive_control_blocked = $controlBlocked
            }
            Write-Task679Evidence
            if (-not $ruleEnabled) {
              throw 'Outbound firewall rule was not observably enabled.'
            }
            if (-not $controlBlocked) {
              throw 'Outbound positive control unexpectedly reached github.com.'
            }
          } catch {
            $evidence.outcome = 'fail'
            $evidence.failure_stage = 'network_isolation'
            Write-Task679Evidence
            throw
          }

      - name: Run offline fresh and pinned-prior upgrade legs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Get-Content -LiteralPath $env:TASK679_EVIDENCE_PATH -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable -Depth 12
          function Write-Task679Evidence {
            [IO.File]::WriteAllText($env:TASK679_EVIDENCE_PATH, ($evidence | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
          }
          function Get-Task679ProtectedInventory {
            $definitions = @(
              [pscustomobject]@{ label = 'project_repo'; file = 'project-repo/sentinel.bin' },
              [pscustomobject]@{ label = 'agent_cli'; file = 'agent-cli/sentinel.bin' },
              [pscustomobject]@{ label = 'non_owned_state'; file = 'non-owned/sentinel.bin' }
            )
            foreach ($definition in $definitions) {
              $path = Join-Path $env:TASK679_PROTECTED_ROOT $definition.file
              $exists = Test-Path -LiteralPath $path -PathType Leaf
              [ordered]@{
                label = [string]$definition.label
                exists = $exists
                sha256 = if ($exists) { (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() } else { '' }
              }
            }
          }
          function Compare-Task679ProtectedInventory {
            param([Parameter(Mandatory)]$Before)
            $beforeByLabel = @{}
            foreach ($item in @($Before)) { $beforeByLabel[[string]$item.label] = [string]$item.sha256 }
            $records = [Collections.Generic.List[object]]::new()
            foreach ($item in @(Get-Task679ProtectedInventory)) {
              $unchanged = [bool]$item.exists -and $beforeByLabel.ContainsKey([string]$item.label) -and [string]::Equals([string]$item.sha256, [string]$beforeByLabel[[string]$item.label], [StringComparison]::Ordinal)
              $records.Add([ordered]@{ label = [string]$item.label; exists = [bool]$item.exists; unchanged = $unchanged })
            }
            return [ordered]@{ all_unchanged = @($records | Where-Object { -not $_.unchanged }).Count -eq 0; items = @($records) }
          }
          function Test-Task679NetworkRule {
            $rule = @(Get-NetFirewallRule -Name $env:TASK679_FIREWALL_RULE -ErrorAction SilentlyContinue)
            return $rule.Count -eq 1 -and [string]$rule[0].Enabled -ceq 'True' -and [string]$rule[0].Direction -ceq 'Outbound' -and [string]$rule[0].Action -ceq 'Block'
          }
          function Invoke-Task679HelperLeg {
            param(
              [Parameter(Mandatory)][ValidateSet('fresh', 'upgrade')][string]$Name,
              [Parameter(Mandatory)]$ProtectedBefore
            )
            $stdoutPath = Join-Path $env:RUNNER_TEMP "task679-$Name.stdout"
            $stderrPath = Join-Path $env:RUNNER_TEMP "task679-$Name.stderr"
            $arguments = @(
              '-NoProfile',
              '-File', 'scripts/test-public-release.ps1',
              '-Surface', 'Desktop',
              '-Version', $env:TASK679_VERSION,
              '-ReleaseTag', "v$env:TASK679_VERSION",
              '-Repository', '${{ github.repository }}',
              '-CandidateInstallerPath', $env:TASK679_CANDIDATE_PATH,
              '-Json'
            )
            if ($Name -ceq 'upgrade') {
              $arguments += @('-PriorInstallerPath', $env:TASK679_PRIOR_PATH, '-PriorVersion', $env:TASK679_PRIOR_VERSION)
            }
            $process = Start-Process -FilePath (Join-Path $PSHOME 'pwsh.exe') -ArgumentList $arguments -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            $inventory = Compare-Task679ProtectedInventory -Before $ProtectedBefore
            $result = [ordered]@{
              status = 'fail'
              exit_code = [int]$process.ExitCode
              receipt_valid = $false
              candidate_version_verified = $false
              candidate_hash_verified = $false
              packaged_page_observed = $false
              cleanup_verified = $false
              installer_contract_verified = $false
              upgrade_payload_replacement_verified = $null
              network_rule_remained_enabled = $false
              protected_inventory = $inventory
              failure = if ($process.ExitCode -eq 0) { 'receipt_invalid' } else { 'helper_exit_nonzero' }
            }
            if ($process.ExitCode -ne 0) {
              return $result
            }
            try {
              $raw = [IO.File]::ReadAllText($stdoutPath) -replace "`r`n", "`n" -replace "`r", "`n"
              $lines = @($raw.TrimEnd("`n") -split "`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              if ($lines.Count -ne 1) { throw 'helper stdout shape invalid' }
              $receipt = $lines[0] | ConvertFrom-Json -Depth 12
              $versionVerified = [string]$receipt.version -ceq $env:TASK679_VERSION -and [string]$receipt.evidence.version -ceq $env:TASK679_VERSION -and [string]$receipt.release_tag -ceq "v$env:TASK679_VERSION"
              $hashVerified = [string]$receipt.evidence.sha256 -ceq $env:TASK679_CANDIDATE_HASH -and [string]$receipt.evidence.asset -ceq $env:TASK679_CANDIDATE_ASSET
              $pageObserved = [string]$receipt.evidence.page_url -match '^(?:tauri://localhost|https?://tauri\.localhost)(?:/|$)'
              $cleanupVerified = $receipt.ok -eq $true -and [string]$receipt.surface -ceq 'Desktop' -and [string]$receipt.cleanup -ceq 'clean'
              $receiptValid = $versionVerified -and $hashVerified -and $pageObserved -and $cleanupVerified
              $result.receipt_valid = $receiptValid
              $result.candidate_version_verified = $versionVerified
              $result.candidate_hash_verified = $hashVerified
              $result.packaged_page_observed = $pageObserved
              $result.cleanup_verified = $cleanupVerified
              $result.installer_contract_verified = $receiptValid
              if ($Name -ceq 'upgrade') {
                $result.upgrade_payload_replacement_verified = $receiptValid
              }
              if ($receiptValid -and $inventory.all_unchanged) {
                $result.status = 'pass'
                $result.failure = ''
              }
            } catch {
              $result.failure = 'receipt_invalid'
            }
            return $result
          }

          $currentStage = 'fresh'
          try {
            if (-not (Test-Task679NetworkRule)) {
              throw 'Outbound network isolation was not active before the fresh leg.'
            }
            $candidateHash = (Get-FileHash -LiteralPath $env:TASK679_CANDIDATE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
            $priorHash = (Get-FileHash -LiteralPath $env:TASK679_PRIOR_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($candidateHash -cne $env:TASK679_CANDIDATE_HASH -or $priorHash -cne $env:TASK679_PRIOR_HASH) {
              throw 'Staged installer hash changed before the offline legs.'
            }
            $fresh = Invoke-Task679HelperLeg -Name fresh -ProtectedBefore $evidence.protected_inventory.before
            $fresh.network_rule_remained_enabled = Test-Task679NetworkRule
            if (-not $fresh.network_rule_remained_enabled) {
              $fresh.status = 'fail'
              $fresh.failure = 'network_rule_missing'
            }
            $evidence.legs.fresh = $fresh
            Write-Task679Evidence
            if ([string]$fresh.status -cne 'pass') {
              throw 'Offline candidate fresh-install leg did not satisfy its receipt contract.'
            }

            $currentStage = 'upgrade'
            if (-not (Test-Task679NetworkRule)) {
              throw 'Outbound network isolation was not active before the upgrade leg.'
            }
            $candidateHash = (Get-FileHash -LiteralPath $env:TASK679_CANDIDATE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
            $priorHash = (Get-FileHash -LiteralPath $env:TASK679_PRIOR_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($candidateHash -cne $env:TASK679_CANDIDATE_HASH -or $priorHash -cne $env:TASK679_PRIOR_HASH) {
              throw 'Staged installer hash changed between the offline legs.'
            }
            $upgrade = Invoke-Task679HelperLeg -Name upgrade -ProtectedBefore $evidence.protected_inventory.before
            $upgrade.network_rule_remained_enabled = Test-Task679NetworkRule
            if (-not $upgrade.network_rule_remained_enabled) {
              $upgrade.status = 'fail'
              $upgrade.failure = 'network_rule_missing'
            }
            $evidence.legs.upgrade = $upgrade
            Write-Task679Evidence
            if ([string]$upgrade.status -cne 'pass') {
              throw 'Offline pinned-prior upgrade leg did not satisfy its receipt contract.'
            }

            $evidence.outcome = 'pass'
            $evidence.failure_stage = ''
            Write-Task679Evidence
          } catch {
            $evidence.outcome = 'fail'
            $evidence.failure_stage = $currentStage
            Write-Task679Evidence
            throw
          }

      - name: Restore runner outbound networking
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ruleName = "winsmux-task679-outbound-${{ github.run_id }}-${{ github.run_attempt }}"
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/task679-nsis-lifecycle/evidence.json'
          $restoreExit = 0
          try {
            Get-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction Stop
            $ruleAbsent = -not [bool](Get-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue)
            if (-not $ruleAbsent) { throw 'Run-scoped outbound firewall rule remained after cleanup.' }
          } catch {
            $restoreExit = 1
            $ruleAbsent = $false
          }
          if (Test-Path -LiteralPath $evidencePath -PathType Leaf) {
            $evidence = Get-Content -LiteralPath $evidencePath -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable -Depth 12
            $evidence.stages.network_restore = [ordered]@{ exit_code = $restoreExit; rule_absent = $ruleAbsent }
            if ($restoreExit -ne 0) {
              $evidence.outcome = 'fail'
              $evidence.failure_stage = 'network_restore'
            }
            [IO.File]::WriteAllText($evidencePath, ($evidence | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
          }
          if ($restoreExit -ne 0) {
            throw 'TASK-679 failed to restore runner outbound networking.'
          }

      - name: Publish non-sensitive lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task679-nsis-lifecycle-evidence
          path: artifacts/task679-nsis-lifecycle/evidence.json
          if-no-files-found: error

  task811-operator-infra:
    name: TASK-811 Operator Infrastructure Receipt
    runs-on: windows-latest
    needs: pester
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve the TASK-810 Pester selection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/winsmux-pester.psm1 -Force
          $selection = Resolve-WinsmuxPester571
          if ($selection.resolution_status -ceq 'missing') {
            $gallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
            if (-not $gallery) { Register-PSRepository -Default -ErrorAction Stop }
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
            Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 5.7.1 -Repository PSGallery -ErrorAction Stop
            $selection = Resolve-WinsmuxPester571
          }
          if ($selection.resolution_status -cne 'resolved') {
            throw "TASK811_FAIL_CLOSED pester_resolution_$($selection.resolution_status)"
          }

      - name: Write and locally assert the durable receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/winsmux-task811-authority.ps1
          $result = Invoke-WinsmuxTask811Transaction
          if ($result.status -cne 'ok') {
            throw 'TASK811_FAIL_CLOSED transaction_not_ok'
          }

      - name: Upload the bound TASK-811 receipt
        uses: actions/upload-artifact@v7
        with:
          name: task811-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/operator-infra/task811-receipt.json
          if-no-files-found: error

  task811-receipt-bind:
    name: TASK-811 Receipt Artifact Bind
    runs-on: windows-latest
    needs: task811-operator-infra
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download the exact TASK-811 receipt artifact
        uses: actions/download-artifact@v8
        with:
          name: task811-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/operator-infra

      - name: Assert one receipt tree and binding before merge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = 'artifacts/operator-infra/task811-receipt.json'
          $downloadedFiles = @(Get-ChildItem -LiteralPath 'artifacts/operator-infra' -File -Recurse -Force)
          if ($downloadedFiles.Count -ne 1 -or -not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
            throw 'TASK811_FAIL_CLOSED downloaded_receipt_shape_invalid'
          }
          . ./scripts/winsmux-task811-authority.ps1
          Assert-WinsmuxTask811Receipt -ArtifactBindingOnly | Out-Null

  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - secret-scan
      - public-surface
      - install-e2e
      - native-lifecycle-source
      - common-contract-drift
      - pester
      - core-build-test
      - desktop-build-test
      - desktop-nsis-lifecycle
      - task811-receipt-bind
    if: always()
    steps:
      - name: Require all checks
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.public-surface.result }}" \
            "${{ needs.install-e2e.result }}" \
            "${{ needs.native-lifecycle-source.result }}" \
            "${{ needs.common-contract-drift.result }}" \
            "${{ needs.pester.result }}" \
            "${{ needs.core-build-test.result }}" \
            "${{ needs.desktop-build-test.result }}" \
            "${{ needs.desktop-nsis-lifecycle.result }}" \
            "${{ needs.task811-receipt-bind.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Merge gate failed because a required job result was '$result'."
              exit 1
            fi
          done
          echo "Merge gate passed."
