name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks Incremental Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.0"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run secret scan since recorded baseline
        shell: pwsh
        run: pwsh -NoProfile -File scripts/gitleaks-history.ps1

  public-surface:
    name: Public Surface Audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap repo hooks
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-git-guard.ps1

      - name: Assert hooks path
        shell: pwsh
        run: |
          $hooksPath = (git config --get core.hooksPath).Trim()
          if ($hooksPath -notmatch '(^|[\\/])\.githooks$') {
            throw "core.hooksPath must point to .githooks, got '$hooksPath'"
          }

      - name: Run git-guard
        shell: pwsh
        run: pwsh -NoProfile -File scripts/git-guard.ps1 -Mode full

      - name: Run public surface audit
        shell: pwsh
        run: pwsh -NoProfile -File scripts/audit-public-surface.ps1

  install-e2e:
    name: Fresh Install E2E (${{ matrix.route }})
    runs-on: windows-2025
    needs: public-surface
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        route: [Npm, Direct, DefectDetection]
    steps:
      - uses: actions/checkout@v6

      - name: Verify installer download targets
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assert-install-downloads-exist.ps1 -RepositoryRoot . -Treeish HEAD

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run fresh install route
        shell: pwsh
        env:
          WINSMUX_INSTALL_E2E_RELEASE_TAG: v0.36.28
          WINSMUX_INSTALL_E2E_GITHUB_ACCESS: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/test-install-e2e.ps1 -Route "${{ matrix.route }}" -RepositoryRoot . -SourceCommit "${{ github.sha }}"

  native-lifecycle-source:
    name: Native Lifecycle Source Boundary
    runs-on: windows-2025
    needs: public-surface
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate native binary
        run: cargo build --release --manifest-path core/Cargo.toml --bin winsmux

      - name: Reject hostile working-directory bridge selection
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-native-bridge-resolution.ps1 -CandidateBinary target/release/winsmux.exe

  common-contract-drift:
    name: Common Contract Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Check common contract package drift
        working-directory: winsmux-app
        run: npm run test:common-contract-package

      - name: Check automation driver pool
        working-directory: winsmux-app
        run: npm run test:automation-driver-pool

  pester-runtime-contract:
    name: Pester Runtime Contract
    runs-on: windows-2025
    needs: public-surface
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Derive and verify official PowerShell runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $authorityPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/pester-runtime-contract.ps1'
          $authorityText = Get-Content -LiteralPath $authorityPath -Raw -Encoding utf8
          function Get-AuthorityLiteral {
            param([Parameter(Mandatory = $true)][string]$Name)
            $pattern = "(?m)^\s*" + [regex]::Escape($Name) + "\s*=\s*'(?<value>[^']+)'\s*$"
            $match = [regex]::Match($authorityText, $pattern)
            if (-not $match.Success) {
              throw "Pester runtime authority does not declare '$Name'."
            }
            $match.Groups['value'].Value
          }

          $runtimeTrain = Get-AuthorityLiteral 'runtime_train'
          $proofVersion = Get-AuthorityLiteral 'ci_proof_version'
          $archiveName = Get-AuthorityLiteral 'archive_name'
          $archiveUri = Get-AuthorityLiteral 'archive_uri'
          $expectedSha256 = Get-AuthorityLiteral 'archive_sha256'
          $bundlePath = Join-Path $env:GITHUB_WORKSPACE 'pester-runtime-bundle'
          $archivePath = Join-Path $bundlePath $archiveName
          $toolPath = Join-Path $env:RUNNER_TEMP 'winsmux-pester-runtime-proof'

          New-Item -ItemType Directory -Force -Path $bundlePath | Out-Null
          Invoke-WebRequest -Uri $archiveUri -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "PowerShell archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolPath -Force
          $runtimePath = Join-Path $toolPath 'pwsh.exe'
          $runtimeVersion = (& $runtimePath -NoProfile -Command '$PSVersionTable.PSVersion.ToString()').Trim()
          if ($LASTEXITCODE -ne 0 -or $runtimeVersion -ne $proofVersion) {
            throw "Expected official PowerShell runtime $proofVersion, got '$runtimeVersion'."
          }

          $probePath = Join-Path $env:RUNNER_TEMP 'assert-pester-runtime.ps1'
          @'
          param([string]$RepositoryRoot)
          $authorityPath = Join-Path $RepositoryRoot 'scripts/pester-runtime-contract.ps1'
          . $authorityPath
          $executable = [System.Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          $contract = Get-WinsmuxPesterRuntimeContract -RepositoryRoot $RepositoryRoot -Executable $executable -Version $PSVersionTable.PSVersion
          Assert-WinsmuxPesterRuntime -Contract $contract -Executable $executable -Version $PSVersionTable.PSVersion | Out-Null
          '@ | Set-Content -LiteralPath $probePath -Encoding utf8NoBOM
          & $runtimePath -NoProfile -NonInteractive -File $probePath -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            throw "The verified PowerShell runtime rejected the canonical Pester authority."
          }

          [ordered]@{
            runtime_train = $runtimeTrain
            runtime_version = $runtimeVersion
            archive_name = $archiveName
            archive_uri = $archiveUri
            archive_sha256 = $actualSha256
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bundlePath 'runtime-evidence.json') -Encoding utf8NoBOM

      - name: Upload verified Pester runtime
        uses: actions/upload-artifact@v7
        with:
          name: pester-runtime-contract
          path: pester-runtime-bundle
          if-no-files-found: error

  pester:
    name: Pester Tests (${{ matrix.name }})
    runs-on: windows-latest
    needs:
      - public-surface
      - pester-runtime-contract
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bridge-foundation
            result: bridge-foundation
            timeout_minutes: 15
            paths: tests/bridge/Foundation.Tests.ps1;tests/bridge/Foundation.Settings.Tests.ps1
            full_name: ""
          - name: bridge-agent-orchestra
            result: bridge-agent-orchestra
            timeout_minutes: 20
            paths: tests/bridge/AgentOrchestra.Tests.ps1;tests/bridge/AgentOrchestra.Bootstrap.Tests.ps1
            full_name: ""
          - name: bridge-command-status
            result: bridge-command-status
            timeout_minutes: 12
            paths: tests/bridge/CommandStatus.Tests.ps1;tests/bridge/CommandStatus.RuntimeIdentity.Tests.ps1
            full_name: ""
          - name: bridge-worker-workspace-sandbox
            result: bridge-worker-workspace-sandbox
            timeout_minutes: 12
            paths: tests/bridge/WorkerWorkspaceSandbox.Tests.ps1
            full_name: ""
          - name: bridge-worker-broker-token
            result: bridge-worker-broker-token
            timeout_minutes: 12
            paths: tests/bridge/WorkerBrokerToken.Tests.ps1
            full_name: ""
          - name: bridge-worker-policy
            result: bridge-worker-policy
            timeout_minutes: 12
            paths: tests/bridge/WorkerPolicy.Tests.ps1
            full_name: ""
          - name: bridge-worker-secrets-status
            result: bridge-worker-secrets-status
            timeout_minutes: 12
            paths: tests/bridge/WorkerSecretsStatus.Tests.ps1
            full_name: ""
          - name: bridge-worker-heartbeat-start
            result: bridge-worker-heartbeat-start
            timeout_minutes: 12
            paths: tests/bridge/WorkerHeartbeatStart.Tests.ps1
            full_name: ""
          - name: bridge-worker-api-agy-exec
            result: bridge-worker-api-agy-exec
            timeout_minutes: 12
            paths: tests/bridge/WorkerApiAgyExec.Tests.ps1
            full_name: ""
          - name: bridge-command-queue-reporting
            result: bridge-command-queue-reporting
            timeout_minutes: 12
            paths: tests/bridge/CommandQueueReporting.Tests.ps1
            full_name: ""
          - name: bridge-command-review-dispatch
            result: bridge-command-review-dispatch
            timeout_minutes: 12
            paths: tests/bridge/CommandReviewDispatch.Tests.ps1
            full_name: ""
          - name: bridge-provider-commands
            result: bridge-provider-commands
            timeout_minutes: 15
            paths: tests/bridge/ProviderCommands.Tests.ps1;tests/bridge/ProviderCommands.Dispatch.Tests.ps1
            full_name: ""
          - name: bridge-artifacts-runtime
            result: bridge-artifacts-runtime
            timeout_minutes: 15
            paths: tests/bridge/ArtifactsRuntime.Tests.ps1;tests/bridge/ArtifactsRuntime.Operator.Tests.ps1
            full_name: ""
          - name: integration
            result: integration
            timeout_minutes: 25
            paths: tests/Integration.GateEnforcement.Tests.ps1;tests/Integration.MultiAgent.Tests.ps1;tests/Integration.PaneMonitorHook.Tests.ps1;tests/Integration.PluginHookLoader.Tests.ps1;tests/Integration.WorktreeHook.Tests.ps1
            full_name: ""
          - name: worker-benchmark
            result: worker-benchmark
            timeout_minutes: 20
            paths: tests/CliBakeoff.Tests.ps1;tests/HarnessContract.Tests.ps1;tests/Runtime.VaultInject.Tests.ps1
            full_name: ""
          - name: release-public
            result: release-public
            timeout_minutes: 20
            paths: tests/PublicSurfacePolicy.Tests.ps1;tests/VersionSurface.Tests.ps1;tests/NpmReleasePackage.Tests.ps1;tests/GitHubWritePreflight.Tests.ps1;tests/McpServerContract.Tests.ps1;tests/ThreatModelContract.Tests.ps1;tests/EnterpriseStrategyAlignment.Tests.ps1;tests/ReviewLatencyHardening.Tests.ps1;tests/UpstreamReevaluation.Tests.ps1
            full_name: ""
          - name: shell-support
            result: shell-support
            timeout_minutes: 15
            paths: tests/BuilderWorktree.Tests.ps1;tests/codex-subagent-worktree-guard.Tests.ps1;tests/OrchestraPreflight.Tests.ps1;tests/PaneBorder.Tests.ps1;tests/V03618ReleaseHardening.Tests.ps1;tests/AgentReadiness.Tests.ps1
            full_name: ""
          - name: repo-audit-v03619
            result: repo-audit-v03619
            timeout_minutes: 12
            paths: tests/V03619RepoAudit.Tests.ps1
            full_name: ""
          - name: coordinator-v03620
            result: coordinator-v03620
            timeout_minutes: 12
            paths: tests/V03620CoordinatorFoundation.Tests.ps1
            full_name: ""
          - name: local-router-v03621
            result: local-router-v03621
            timeout_minutes: 12
            paths: tests/V03621LocalRouterShadow.Tests.ps1
            full_name: ""
          - name: desktop-split-v03626
            result: desktop-split-v03626
            timeout_minutes: 12
            paths: tests/V03626DesktopSplitGate.Tests.ps1
            full_name: ""
          - name: compat-performance-v03627
            result: compat-performance-v03627
            timeout_minutes: 12
            paths: tests/V03627CompatPerformanceGate.Tests.ps1
            full_name: ""
          - name: race-abnormal-soak-v03628
            result: race-abnormal-soak-v03628
            timeout_minutes: 12
            paths: tests/V03628RaceAbnormalSoak.Tests.ps1
            full_name: ""
          - name: runtime-reliability-v03628
            result: runtime-reliability-v03628
            timeout_minutes: 12
            paths: tests/V03628RuntimeReliabilityGate.Tests.ps1
            full_name: ""
          - name: packaged-restore-v03628
            result: packaged-restore-v03628
            timeout_minutes: 12
            paths: tests/V03628PackagedRestoreGate.Tests.ps1
            full_name: ""
    steps:
      - uses: actions/checkout@v6

      - name: Download verified Pester runtime
        uses: actions/download-artifact@v8
        with:
          name: pester-runtime-contract
          path: ${{ runner.temp }}/pester-runtime-bundle

      - name: Prepare verified Pester runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundlePath = Join-Path $env:RUNNER_TEMP 'pester-runtime-bundle'
          $evidence = Get-Content -LiteralPath (Join-Path $bundlePath 'runtime-evidence.json') -Raw -Encoding utf8 | ConvertFrom-Json
          $archivePath = Join-Path $bundlePath ([string]$evidence.archive_name)
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actualSha256 -ne [string]$evidence.archive_sha256) {
            throw "Downloaded Pester runtime artifact does not match its verified evidence."
          }
          $toolPath = Join-Path $env:RUNNER_TEMP 'winsmux-pester-runtime'
          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolPath -Force
          $runtimePath = Join-Path $toolPath 'pwsh.exe'
          $runtimeVersion = (& $runtimePath -NoProfile -Command '$PSVersionTable.PSVersion.ToString()').Trim()
          if ($LASTEXITCODE -ne 0 -or $runtimeVersion -ne [string]$evidence.runtime_version) {
            throw "Downloaded Pester runtime version does not match its verified evidence."
          }
          "WINSMUX_PESTER_RUNTIME=$runtimePath" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Pester
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'install-pester.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $existing = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'5.0.0' } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $existing) {
            $repo = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
            if (-not $repo) {
              Register-PSRepository -Default -ErrorAction Stop
            }
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0 -Repository PSGallery -ErrorAction Stop
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }
          Import-Module Pester -MinimumVersion 5.0 -Force
          Get-Module Pester | Format-Table Name,Version,Path -AutoSize
          '@ | Set-Content -LiteralPath $installerPath -Encoding utf8NoBOM
          & $env:WINSMUX_PESTER_RUNTIME -NoProfile -NonInteractive -File $installerPath
          if ($LASTEXITCODE -ne 0) {
            throw "Pester installation failed under the verified runtime."
          }

      - name: Run Pester (${{ matrix.name }})
        shell: pwsh
        run: |
          $shardScript = Join-Path $env:RUNNER_TEMP 'run-pester-shard.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $authorityPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/pester-runtime-contract.ps1'
          . $authorityPath
          $runtimeExecutable = [System.IO.Path]::GetFullPath(
            [System.Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          )
          $runtimeContract = Get-WinsmuxPesterRuntimeContract -RepositoryRoot $env:GITHUB_WORKSPACE -Executable $runtimeExecutable -Version $PSVersionTable.PSVersion
          Assert-WinsmuxPesterRuntime -Contract $runtimeContract -Executable $runtimeExecutable -Version $PSVersionTable.PSVersion | Out-Null
          $categoryName = '${{ matrix.name }}'
          if ($categoryName -like 'bridge-*') {
            & $runtimeExecutable -NoProfile -File scripts/assert-pester-shard-coverage.ps1 | Write-Host
            if ($LASTEXITCODE -ne 0) {
              throw "Bridge shard coverage gate failed."
            }
          }
          $requestedPaths = @('${{ matrix.paths }}' -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $resolvedPaths = @()
          foreach ($requested in $requestedPaths) {
            $matches = @(Resolve-Path -Path $requested -ErrorAction Stop)
            foreach ($match in $matches) {
              $resolvedPaths += $match.ProviderPath
            }
          }
          $resolvedPaths = @($resolvedPaths | Sort-Object -Unique)
          if ($resolvedPaths.Count -eq 0) {
            throw "No Pester test files matched for category '${{ matrix.name }}'."
          }
          Write-Host "::group::Pester category ${{ matrix.name }} targets"
          foreach ($path in $resolvedPaths) {
            $item = Get-Item -LiteralPath $path
            $relative = Resolve-Path -LiteralPath $path -Relative
            Write-Host ("{0} ({1:n0} bytes)" -f $relative, $item.Length)
          }
          Write-Host "::endgroup::"

          $config = New-PesterConfiguration
          $config.Run.Path = $resolvedPaths
          $config.Run.Exit = $false
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results-${{ matrix.result }}.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          $result = Invoke-Pester -Configuration $config
          [ordered]@{
            observation_id = [guid]::NewGuid().ToString('N')
            pid = $PID
            executable = $runtimeExecutable
            version = $PSVersionTable.PSVersion.ToString()
            result = [string]$result.Result
            passed = [int]$result.PassedCount
            failed = [int]$result.FailedCount
            total = [int]$result.TotalCount
          } | ConvertTo-Json | Set-Content -LiteralPath 'runtime-observation-${{ matrix.result }}.json' -Encoding utf8NoBOM
          if ([int]$result.FailedCount -gt 0 -or
              [int]$result.FailedBlocksCount -gt 0 -or
              [int]$result.FailedContainersCount -gt 0) {
            exit 1
          }
          '@ | Set-Content -LiteralPath $shardScript -Encoding utf8NoBOM
          & $env:WINSMUX_PESTER_RUNTIME -NoProfile -NonInteractive -File $shardScript
          if ($LASTEXITCODE -ne 0) {
            throw "Pester shard failed under the verified runtime."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.result }}
          path: |
            test-results-${{ matrix.result }}.xml
            runtime-observation-${{ matrix.result }}.json
          if-no-files-found: error

  core-build-test:
    name: Core Build and Test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build core
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Test core
        run: cargo test --manifest-path core/Cargo.toml

  desktop-build-test:
    name: Desktop Build and Test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Build frontend
        working-directory: winsmux-app
        run: npm run build

      - name: Test Tauri backend
        run: cargo test --manifest-path winsmux-app/src-tauri/Cargo.toml

      - name: Build desktop binary without bundling
        working-directory: winsmux-app
        run: npm run tauri -- build --no-bundle

  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - secret-scan
      - public-surface
      - install-e2e
      - native-lifecycle-source
      - common-contract-drift
      - pester
      - pester-runtime-contract
      - core-build-test
      - desktop-build-test
    if: always()
    steps:
      - name: Require all checks
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.public-surface.result }}" \
            "${{ needs.install-e2e.result }}" \
            "${{ needs.native-lifecycle-source.result }}" \
            "${{ needs.common-contract-drift.result }}" \
            "${{ needs.pester.result }}" \
            "${{ needs.pester-runtime-contract.result }}" \
            "${{ needs.core-build-test.result }}" \
            "${{ needs.desktop-build-test.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Merge gate failed because a required job result was '$result'."
              exit 1
            fi
          done
          echo "Merge gate passed."
