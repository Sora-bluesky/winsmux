name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks Incremental Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.0"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run secret scan since recorded baseline
        shell: pwsh
        run: pwsh -NoProfile -File scripts/gitleaks-history.ps1

  public-surface:
    name: Public Surface Audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap repo hooks
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bootstrap-git-guard.ps1

      - name: Assert hooks path
        shell: pwsh
        run: |
          $hooksPath = (git config --get core.hooksPath).Trim()
          if ($hooksPath -notmatch '(^|[\\/])\.githooks$') {
            throw "core.hooksPath must point to .githooks, got '$hooksPath'"
          }

      - name: Run git-guard
        shell: pwsh
        run: pwsh -NoProfile -File scripts/git-guard.ps1 -Mode full

      - name: Run public surface audit
        shell: pwsh
        run: pwsh -NoProfile -File scripts/audit-public-surface.ps1

  install-e2e:
    name: Fresh Install E2E (${{ matrix.route }})
    runs-on: windows-2025
    needs: public-surface
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        route: [Npm, Direct, DefectDetection]
    steps:
      - uses: actions/checkout@v6

      - name: Verify installer download targets
        shell: pwsh
        run: pwsh -NoProfile -File scripts/assert-install-downloads-exist.ps1 -RepositoryRoot . -Treeish HEAD

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run fresh install route
        shell: pwsh
        env:
          WINSMUX_INSTALL_E2E_RELEASE_TAG: v0.36.28
          WINSMUX_INSTALL_E2E_GITHUB_ACCESS: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/test-install-e2e.ps1 -Route "${{ matrix.route }}" -RepositoryRoot . -SourceCommit "${{ github.sha }}"

  native-lifecycle-source:
    name: Native Lifecycle Source Boundary
    runs-on: windows-2025
    needs: public-surface
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build candidate native binary
        run: cargo build --release --manifest-path core/Cargo.toml --bin winsmux

      - name: Reject hostile working-directory bridge selection
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-native-bridge-resolution.ps1 -CandidateBinary target/release/winsmux.exe

  common-contract-drift:
    name: Common Contract Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Check common contract package drift
        working-directory: winsmux-app
        run: npm run test:common-contract-package

      - name: Check automation driver pool
        working-directory: winsmux-app
        run: npm run test:automation-driver-pool

  pester:
    name: Pester Tests (${{ matrix.name }})
    runs-on: windows-latest
    needs: public-surface
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bridge-foundation
            result: bridge-foundation
            timeout_minutes: 15
            paths: tests/bridge/Foundation.Tests.ps1;tests/bridge/Foundation.Settings.Tests.ps1
            full_name: ""
          - name: bridge-agent-orchestra
            result: bridge-agent-orchestra
            timeout_minutes: 20
            paths: tests/bridge/AgentOrchestra.Tests.ps1;tests/bridge/AgentOrchestra.Bootstrap.Tests.ps1
            full_name: ""
          - name: bridge-command-status
            result: bridge-command-status
            timeout_minutes: 12
            paths: tests/bridge/CommandStatus.Tests.ps1;tests/bridge/CommandStatus.RuntimeIdentity.Tests.ps1
            full_name: ""
          - name: bridge-worker-workspace-sandbox
            result: bridge-worker-workspace-sandbox
            timeout_minutes: 12
            paths: tests/bridge/WorkerWorkspaceSandbox.Tests.ps1
            full_name: ""
          - name: bridge-worker-broker-token
            result: bridge-worker-broker-token
            timeout_minutes: 12
            paths: tests/bridge/WorkerBrokerToken.Tests.ps1
            full_name: ""
          - name: bridge-worker-policy
            result: bridge-worker-policy
            timeout_minutes: 12
            paths: tests/bridge/WorkerPolicy.Tests.ps1
            full_name: ""
          - name: bridge-worker-secrets-status
            result: bridge-worker-secrets-status
            timeout_minutes: 12
            paths: tests/bridge/WorkerSecretsStatus.Tests.ps1
            full_name: ""
          - name: bridge-worker-heartbeat-start
            result: bridge-worker-heartbeat-start
            timeout_minutes: 12
            paths: tests/bridge/WorkerHeartbeatStart.Tests.ps1
            full_name: ""
          - name: bridge-worker-api-agy-exec
            result: bridge-worker-api-agy-exec
            timeout_minutes: 12
            paths: tests/bridge/WorkerApiAgyExec.Tests.ps1
            full_name: ""
          - name: bridge-command-queue-reporting
            result: bridge-command-queue-reporting
            timeout_minutes: 12
            paths: tests/bridge/CommandQueueReporting.Tests.ps1
            full_name: ""
          - name: bridge-command-review-dispatch
            result: bridge-command-review-dispatch
            timeout_minutes: 12
            paths: tests/bridge/CommandReviewDispatch.Tests.ps1
            full_name: ""
          - name: bridge-provider-commands
            result: bridge-provider-commands
            timeout_minutes: 15
            paths: tests/bridge/ProviderCommands.Tests.ps1;tests/bridge/ProviderCommands.Dispatch.Tests.ps1
            full_name: ""
          - name: bridge-artifacts-runtime
            result: bridge-artifacts-runtime
            timeout_minutes: 15
            paths: tests/bridge/ArtifactsRuntime.Tests.ps1;tests/bridge/ArtifactsRuntime.Operator.Tests.ps1
            full_name: ""
          - name: integration
            result: integration
            timeout_minutes: 25
            paths: tests/Integration.GateEnforcement.Tests.ps1;tests/Integration.MultiAgent.Tests.ps1;tests/Integration.PaneMonitorHook.Tests.ps1;tests/Integration.PluginHookLoader.Tests.ps1;tests/Integration.WorktreeHook.Tests.ps1;tests/Task839WorktreeReviewState.Tests.ps1;tests/V03630DesktopDebugGate.Tests.ps1
            full_name: ""
          - name: worker-benchmark
            result: worker-benchmark
            timeout_minutes: 20
            paths: tests/CliBakeoff.Tests.ps1;tests/HarnessContract.Tests.ps1;tests/Runtime.VaultInject.Tests.ps1
            full_name: ""
          - name: release-public
            result: release-public
            timeout_minutes: 20
            paths: tests/PublicSurfacePolicy.Tests.ps1;tests/VersionSurface.Tests.ps1;tests/NpmReleasePackage.Tests.ps1;tests/GitHubWritePreflight.Tests.ps1;tests/McpServerContract.Tests.ps1;tests/ThreatModelContract.Tests.ps1;tests/EnterpriseStrategyAlignment.Tests.ps1;tests/ReviewLatencyHardening.Tests.ps1;tests/UpstreamReevaluation.Tests.ps1
            full_name: ""
          - name: shell-support
            result: shell-support
            timeout_minutes: 15
            paths: tests/BuilderWorktree.Tests.ps1;tests/codex-subagent-worktree-guard.Tests.ps1;tests/OrchestraPreflight.Tests.ps1;tests/PaneBorder.Tests.ps1;tests/V03618ReleaseHardening.Tests.ps1;tests/AgentReadiness.Tests.ps1
            full_name: ""
          - name: repo-audit-v03619
            result: repo-audit-v03619
            timeout_minutes: 12
            paths: tests/V03619RepoAudit.Tests.ps1
            full_name: ""
          - name: coordinator-v03620
            result: coordinator-v03620
            timeout_minutes: 12
            paths: tests/V03620CoordinatorFoundation.Tests.ps1
            full_name: ""
          - name: local-router-v03621
            result: local-router-v03621
            timeout_minutes: 12
            paths: tests/V03621LocalRouterShadow.Tests.ps1
            full_name: ""
          - name: desktop-split-v03626
            result: desktop-split-v03626
            timeout_minutes: 12
            paths: tests/V03626DesktopSplitGate.Tests.ps1
            full_name: ""
          - name: compat-performance-v03627
            result: compat-performance-v03627
            timeout_minutes: 12
            paths: tests/V03627CompatPerformanceGate.Tests.ps1
            full_name: ""
          - name: race-abnormal-soak-v03628
            result: race-abnormal-soak-v03628
            timeout_minutes: 12
            paths: tests/V03628RaceAbnormalSoak.Tests.ps1
            full_name: ""
          - name: runtime-reliability-v03628
            result: runtime-reliability-v03628
            timeout_minutes: 12
            paths: tests/V03628RuntimeReliabilityGate.Tests.ps1
            full_name: ""
          - name: packaged-restore-v03628
            result: packaged-restore-v03628
            timeout_minutes: 12
            paths: tests/V03628PackagedRestoreGate.Tests.ps1
            full_name: ""
    steps:
      - uses: actions/checkout@v6

      - name: Run Pester (${{ matrix.name }})
        shell: pwsh
        run: |
          if ('${{ matrix.name }}' -like 'bridge-*') {
            & ./scripts/assert-pester-shard-coverage.ps1
          }
          # TASK-810 consumer begin: matrix
          $ErrorActionPreference = 'Stop'
          $callerId = '${{ matrix.name }}'
          $expectedResultFile = 'test-results-${{ matrix.result }}.xml'
          $exitCode = 2
          function Get-Task810RunnerJson {
            param([string]$ShardId)
            $capture = @(& ./scripts/run-pester-shard.ps1 -ShardId $ShardId)
            if ($capture.Count -ne 1 -or $capture[0] -isnot [string]) { return $null }
            if ([string]$capture[0] -match "[`r`n]") { return $null }
            return [string]$capture[0]
          }
          function Get-Task810ConsumerRow {
            param([AllowNull()][string]$Json, [string]$ExpectedShardId, [string]$ExpectedResultFile)
            if ([string]::IsNullOrEmpty($Json)) { return $null }
            try { $envelope = $Json | ConvertFrom-Json -AsHashtable -Depth 8 -ErrorAction Stop } catch { return $null }
            if ($envelope -isnot [Collections.IDictionary]) { return $null }
            $rootKeys = @('schema_version','shard_id','resolution_status','execution_status','test_outcome','failure_origin','workflow_action','pester_invoked','result_file','error_code','selected_module')
            if (@(Compare-Object -ReferenceObject $rootKeys -DifferenceObject @($envelope.Keys) -SyncWindow 0).Count -ne 0) { return $null }
            $stringKeys = @('schema_version','shard_id','resolution_status','execution_status','test_outcome','failure_origin','workflow_action','result_file','error_code')
            if (@($stringKeys.Where({ $envelope[$_] -isnot [string] })).Count -ne 0 -or $envelope.pester_invoked -isnot [bool]) { return $null }
            if ($envelope.schema_version -cne '1' -or $envelope.shard_id -cne $ExpectedShardId) { return $null }
            $resolutionStatuses = @('resolved','missing','ambiguous','empty','unknown','duplicate','artifact_conflict','runtime_failure')
            $executionStatuses = @('not_started','completed')
            $testOutcomes = @('not_run','passed','failed')
            $failureOrigins = @('none','assertion','test_runtime','block_or_container','mixed')
            $workflowActions = @('install_once_then_rerun','succeed','fail')
            $errorCodes = @('none','shard_id_empty','shard_id_unknown','shard_registry_duplicate','preexisting_result_file','pester_5_7_1_missing','pester_5_7_1_ambiguous','resolver_runtime_failure','pester_import_failure','pester_configuration_failure','pester_runtime_failure','pester_result_invalid','pester_result_file_missing','pester_tests_failed')
            if ($envelope.resolution_status -cnotin $resolutionStatuses -or $envelope.execution_status -cnotin $executionStatuses -or $envelope.test_outcome -cnotin $testOutcomes -or $envelope.failure_origin -cnotin $failureOrigins -or $envelope.workflow_action -cnotin $workflowActions -or $envelope.error_code -cnotin $errorCodes) { return $null }
            if ($envelope.result_file -cne '' -and $envelope.result_file -cne $ExpectedResultFile) { return $null }
            if ($envelope.selected_module -isnot [Collections.IDictionary]) { return $null }
            $moduleKeys = @('present','name','semantic_version','manifest_path')
            if (@(Compare-Object -ReferenceObject $moduleKeys -DifferenceObject @($envelope.selected_module.Keys) -SyncWindow 0).Count -ne 0) { return $null }
            if ($envelope.selected_module.present -isnot [bool] -or @($moduleKeys.Where({ $_ -ne 'present' -and $envelope.selected_module[$_] -isnot [string] })).Count -ne 0) { return $null }
            $moduleState = if ($envelope.selected_module.present) {
              $manifestPath = $envelope.selected_module.manifest_path
              if ($envelope.selected_module.name -cne 'Pester' -or $envelope.selected_module.semantic_version -cne '5.7.1' -or -not [IO.Path]::IsPathFullyQualified($manifestPath) -or [IO.Path]::GetFileName($manifestPath) -cne 'Pester.psd1' -or -not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { return $null }
              try { $normalizedManifestPath = (Resolve-Path -LiteralPath $manifestPath -ErrorAction Stop).ProviderPath } catch { return $null }
              if ($manifestPath -cne $normalizedManifestPath) { return $null }
              'present'
            } else {
              if ($envelope.selected_module.name -cne '' -or $envelope.selected_module.semantic_version -cne '' -or $envelope.selected_module.manifest_path -cne '') { return $null }
              'absent'
            }
            $state = '{0}|{1}|{2}|{3}|{4}|{5}|{6}|{7}' -f $envelope.resolution_status,$envelope.execution_status,$envelope.test_outcome,$envelope.failure_origin,$envelope.workflow_action,$envelope.pester_invoked,$envelope.error_code,$moduleState
            $emptyResultStates = @(
              'unknown|not_started|not_run|none|fail|False|shard_id_unknown|absent',
              'empty|not_started|not_run|none|fail|False|shard_id_empty|absent',
              'duplicate|not_started|not_run|none|fail|False|shard_registry_duplicate|absent'
            )
            if ($envelope.result_file -ceq '' -and $state -cnotin $emptyResultStates) { return $null }
            switch -Exact ($state) {
              'unknown|not_started|not_run|none|fail|False|shard_id_unknown|absent' { if ($envelope.result_file -ceq '') { return 'P00' } }
              'empty|not_started|not_run|none|fail|False|shard_id_empty|absent' { if ($envelope.result_file -ceq '') { return 'P01' } }
              'duplicate|not_started|not_run|none|fail|False|shard_registry_duplicate|absent' { if ($envelope.result_file -ceq '') { return 'P02' } }
              'artifact_conflict|not_started|not_run|none|fail|False|preexisting_result_file|absent' { return 'P03' }
              'missing|not_started|not_run|none|install_once_then_rerun|False|pester_5_7_1_missing|absent' { return 'P04' }
              'ambiguous|not_started|not_run|none|fail|False|pester_5_7_1_ambiguous|absent' { return 'P05' }
              'runtime_failure|not_started|not_run|none|fail|False|resolver_runtime_failure|absent' { return 'P06' }
              'resolved|not_started|not_run|none|fail|False|pester_import_failure|present' { return 'P07' }
              'resolved|not_started|not_run|none|fail|False|pester_configuration_failure|present' { return 'P08' }
              'resolved|not_started|not_run|none|fail|True|pester_runtime_failure|present' { return 'P09' }
              'resolved|completed|not_run|none|fail|True|pester_result_invalid|present' { return 'P10' }
              'resolved|completed|passed|none|fail|True|pester_result_file_missing|present' { return 'P11' }
              'resolved|completed|failed|assertion|fail|True|pester_result_file_missing|present' { return 'P12' }
              'resolved|completed|failed|test_runtime|fail|True|pester_result_file_missing|present' { return 'P13' }
              'resolved|completed|failed|block_or_container|fail|True|pester_result_file_missing|present' { return 'P14' }
              'resolved|completed|failed|mixed|fail|True|pester_result_file_missing|present' { return 'P15' }
              'resolved|completed|passed|none|succeed|True|none|present' { return 'P16' }
              'resolved|completed|failed|assertion|fail|True|pester_tests_failed|present' { return 'P17' }
              'resolved|completed|failed|test_runtime|fail|True|pester_tests_failed|present' { return 'P18' }
              'resolved|completed|failed|block_or_container|fail|True|pester_tests_failed|present' { return 'P19' }
              'resolved|completed|failed|mixed|fail|True|pester_tests_failed|present' { return 'P20' }
            }
            return $null
          }
          try {
            $row = Get-Task810ConsumerRow -Json (Get-Task810RunnerJson -ShardId $callerId) -ExpectedShardId $callerId -ExpectedResultFile $expectedResultFile
            if ($row -eq 'P04') {
              try {
                $repo = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
                if (-not $repo) {
                  Register-PSRepository -Default -ErrorAction Stop
                }
                Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -Repository PSGallery -ErrorAction Stop
              } catch { $row = $null }
              if ($null -ne $row) {
                $row = Get-Task810ConsumerRow -Json (Get-Task810RunnerJson -ShardId $callerId) -ExpectedShardId $callerId -ExpectedResultFile $expectedResultFile
                if ($row -eq 'P04') { $row = $null }
              }
            }
            if ($row -in @('P16','P17','P18','P19','P20') -and -not (Test-Path -LiteralPath $expectedResultFile -PathType Leaf)) { $row = $null }
            if ($row -eq 'P16') { $exitCode = 0 }
            if ($row -in @('P17','P18','P19','P20')) { $exitCode = 1 }
          } catch { $exitCode = 2 }
          exit $exitCode
          # TASK-810 consumer end: matrix

      - name: Upload test results
        if: ${{ always() && hashFiles(format('test-results-{0}.xml', matrix.result)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.result }}
          path: test-results-${{ matrix.result }}.xml

  core-build-test:
    name: Core Build and Test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build core
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Test core
        run: cargo test --manifest-path core/Cargo.toml

  desktop-build-test:
    name: Desktop Build and Test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Build frontend
        working-directory: winsmux-app
        run: npm run build

      - name: Test Tauri backend
        run: cargo test --manifest-path winsmux-app/src-tauri/Cargo.toml

      - name: Build desktop binary without bundling
        working-directory: winsmux-app
        run: npm run tauri -- build --no-bundle

      - name: Run V03630 desktop debug process gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appPath = (Resolve-Path -LiteralPath 'target/release/winsmux-app.exe' -ErrorAction Stop).ProviderPath

          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          try {
            $listener.Start()
            $debugPort = ([Net.IPEndPoint]$listener.LocalEndpoint).Port
          } finally {
            $listener.Stop()
          }
          if ($debugPort -lt 1024 -or $debugPort -gt 65535) {
            throw "Allocated debug port is outside 1024..65535: $debugPort"
          }

          $env:WINSMUX_DBGGATE_APP_EXE = $appPath
          $env:WINSMUX_DBGGATE_PORT = [string]$debugPort
          # TASK-810 consumer begin: desktop
          $callerId = 'desktop-debug-process'
          $expectedResultFile = 'test-results-desktop-debug-v03630.xml'
          $exitCode = 2
          function Get-Task810RunnerJson {
            param([string]$ShardId)
            $capture = @(& ./scripts/run-pester-shard.ps1 -ShardId $ShardId)
            if ($capture.Count -ne 1 -or $capture[0] -isnot [string]) { return $null }
            if ([string]$capture[0] -match "[`r`n]") { return $null }
            return [string]$capture[0]
          }
          function Get-Task810ConsumerRow {
            param([AllowNull()][string]$Json, [string]$ExpectedShardId, [string]$ExpectedResultFile)
            if ([string]::IsNullOrEmpty($Json)) { return $null }
            try { $envelope = $Json | ConvertFrom-Json -AsHashtable -Depth 8 -ErrorAction Stop } catch { return $null }
            if ($envelope -isnot [Collections.IDictionary]) { return $null }
            $rootKeys = @('schema_version','shard_id','resolution_status','execution_status','test_outcome','failure_origin','workflow_action','pester_invoked','result_file','error_code','selected_module')
            if (@(Compare-Object -ReferenceObject $rootKeys -DifferenceObject @($envelope.Keys) -SyncWindow 0).Count -ne 0) { return $null }
            $stringKeys = @('schema_version','shard_id','resolution_status','execution_status','test_outcome','failure_origin','workflow_action','result_file','error_code')
            if (@($stringKeys.Where({ $envelope[$_] -isnot [string] })).Count -ne 0 -or $envelope.pester_invoked -isnot [bool]) { return $null }
            if ($envelope.schema_version -cne '1' -or $envelope.shard_id -cne $ExpectedShardId) { return $null }
            $resolutionStatuses = @('resolved','missing','ambiguous','empty','unknown','duplicate','artifact_conflict','runtime_failure')
            $executionStatuses = @('not_started','completed')
            $testOutcomes = @('not_run','passed','failed')
            $failureOrigins = @('none','assertion','test_runtime','block_or_container','mixed')
            $workflowActions = @('install_once_then_rerun','succeed','fail')
            $errorCodes = @('none','shard_id_empty','shard_id_unknown','shard_registry_duplicate','preexisting_result_file','pester_5_7_1_missing','pester_5_7_1_ambiguous','resolver_runtime_failure','pester_import_failure','pester_configuration_failure','pester_runtime_failure','pester_result_invalid','pester_result_file_missing','pester_tests_failed')
            if ($envelope.resolution_status -cnotin $resolutionStatuses -or $envelope.execution_status -cnotin $executionStatuses -or $envelope.test_outcome -cnotin $testOutcomes -or $envelope.failure_origin -cnotin $failureOrigins -or $envelope.workflow_action -cnotin $workflowActions -or $envelope.error_code -cnotin $errorCodes) { return $null }
            if ($envelope.result_file -cne '' -and $envelope.result_file -cne $ExpectedResultFile) { return $null }
            if ($envelope.selected_module -isnot [Collections.IDictionary]) { return $null }
            $moduleKeys = @('present','name','semantic_version','manifest_path')
            if (@(Compare-Object -ReferenceObject $moduleKeys -DifferenceObject @($envelope.selected_module.Keys) -SyncWindow 0).Count -ne 0) { return $null }
            if ($envelope.selected_module.present -isnot [bool] -or @($moduleKeys.Where({ $_ -ne 'present' -and $envelope.selected_module[$_] -isnot [string] })).Count -ne 0) { return $null }
            $moduleState = if ($envelope.selected_module.present) {
              $manifestPath = $envelope.selected_module.manifest_path
              if ($envelope.selected_module.name -cne 'Pester' -or $envelope.selected_module.semantic_version -cne '5.7.1' -or -not [IO.Path]::IsPathFullyQualified($manifestPath) -or [IO.Path]::GetFileName($manifestPath) -cne 'Pester.psd1' -or -not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { return $null }
              try { $normalizedManifestPath = (Resolve-Path -LiteralPath $manifestPath -ErrorAction Stop).ProviderPath } catch { return $null }
              if ($manifestPath -cne $normalizedManifestPath) { return $null }
              'present'
            } else {
              if ($envelope.selected_module.name -cne '' -or $envelope.selected_module.semantic_version -cne '' -or $envelope.selected_module.manifest_path -cne '') { return $null }
              'absent'
            }
            $state = '{0}|{1}|{2}|{3}|{4}|{5}|{6}|{7}' -f $envelope.resolution_status,$envelope.execution_status,$envelope.test_outcome,$envelope.failure_origin,$envelope.workflow_action,$envelope.pester_invoked,$envelope.error_code,$moduleState
            $emptyResultStates = @(
              'unknown|not_started|not_run|none|fail|False|shard_id_unknown|absent',
              'empty|not_started|not_run|none|fail|False|shard_id_empty|absent',
              'duplicate|not_started|not_run|none|fail|False|shard_registry_duplicate|absent'
            )
            if ($envelope.result_file -ceq '' -and $state -cnotin $emptyResultStates) { return $null }
            switch -Exact ($state) {
              'unknown|not_started|not_run|none|fail|False|shard_id_unknown|absent' { if ($envelope.result_file -ceq '') { return 'P00' } }
              'empty|not_started|not_run|none|fail|False|shard_id_empty|absent' { if ($envelope.result_file -ceq '') { return 'P01' } }
              'duplicate|not_started|not_run|none|fail|False|shard_registry_duplicate|absent' { if ($envelope.result_file -ceq '') { return 'P02' } }
              'artifact_conflict|not_started|not_run|none|fail|False|preexisting_result_file|absent' { return 'P03' }
              'missing|not_started|not_run|none|install_once_then_rerun|False|pester_5_7_1_missing|absent' { return 'P04' }
              'ambiguous|not_started|not_run|none|fail|False|pester_5_7_1_ambiguous|absent' { return 'P05' }
              'runtime_failure|not_started|not_run|none|fail|False|resolver_runtime_failure|absent' { return 'P06' }
              'resolved|not_started|not_run|none|fail|False|pester_import_failure|present' { return 'P07' }
              'resolved|not_started|not_run|none|fail|False|pester_configuration_failure|present' { return 'P08' }
              'resolved|not_started|not_run|none|fail|True|pester_runtime_failure|present' { return 'P09' }
              'resolved|completed|not_run|none|fail|True|pester_result_invalid|present' { return 'P10' }
              'resolved|completed|passed|none|fail|True|pester_result_file_missing|present' { return 'P11' }
              'resolved|completed|failed|assertion|fail|True|pester_result_file_missing|present' { return 'P12' }
              'resolved|completed|failed|test_runtime|fail|True|pester_result_file_missing|present' { return 'P13' }
              'resolved|completed|failed|block_or_container|fail|True|pester_result_file_missing|present' { return 'P14' }
              'resolved|completed|failed|mixed|fail|True|pester_result_file_missing|present' { return 'P15' }
              'resolved|completed|passed|none|succeed|True|none|present' { return 'P16' }
              'resolved|completed|failed|assertion|fail|True|pester_tests_failed|present' { return 'P17' }
              'resolved|completed|failed|test_runtime|fail|True|pester_tests_failed|present' { return 'P18' }
              'resolved|completed|failed|block_or_container|fail|True|pester_tests_failed|present' { return 'P19' }
              'resolved|completed|failed|mixed|fail|True|pester_tests_failed|present' { return 'P20' }
            }
            return $null
          }
          try {
            $row = Get-Task810ConsumerRow -Json (Get-Task810RunnerJson -ShardId $callerId) -ExpectedShardId $callerId -ExpectedResultFile $expectedResultFile
            if ($row -eq 'P04') {
              try {
                $repo = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
                if (-not $repo) {
                  Register-PSRepository -Default -ErrorAction Stop
                }
                Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -Repository PSGallery -ErrorAction Stop
              } catch { $row = $null }
              if ($null -ne $row) {
                $row = Get-Task810ConsumerRow -Json (Get-Task810RunnerJson -ShardId $callerId) -ExpectedShardId $callerId -ExpectedResultFile $expectedResultFile
                if ($row -eq 'P04') { $row = $null }
              }
            }
            if ($row -in @('P16','P17','P18','P19','P20') -and -not (Test-Path -LiteralPath $expectedResultFile -PathType Leaf)) { $row = $null }
            if ($row -eq 'P16') { $exitCode = 0 }
            if ($row -in @('P17','P18','P19','P20')) { $exitCode = 1 }
          } catch { $exitCode = 2
          } finally {
            Remove-Item Env:WINSMUX_DBGGATE_APP_EXE -ErrorAction SilentlyContinue
            Remove-Item Env:WINSMUX_DBGGATE_PORT -ErrorAction SilentlyContinue
          }
          exit $exitCode
          # TASK-810 consumer end: desktop

      - name: Upload V03630 desktop debug process results
        if: ${{ always() && hashFiles('test-results-desktop-debug-v03630.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-desktop-debug-v03630
          path: test-results-desktop-debug-v03630.xml

  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - secret-scan
      - public-surface
      - install-e2e
      - native-lifecycle-source
      - common-contract-drift
      - pester
      - core-build-test
      - desktop-build-test
    if: always()
    steps:
      - name: Require all checks
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.public-surface.result }}" \
            "${{ needs.install-e2e.result }}" \
            "${{ needs.native-lifecycle-source.result }}" \
            "${{ needs.common-contract-drift.result }}" \
            "${{ needs.pester.result }}" \
            "${{ needs.core-build-test.result }}" \
            "${{ needs.desktop-build-test.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Merge gate failed because a required job result was '$result'."
              exit 1
            fi
          done
          echo "Merge gate passed."
