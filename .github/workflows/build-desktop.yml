name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'winsmux-app/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    paths:
      - 'winsmux-app/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - uses: ./.github/actions/setup-windows-distribution-toolchain

      - name: Verify exact Windows runtime import contracts
        run: node --test tests/workspace-package/windows-runtime.test.mjs

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Build frontend
        working-directory: winsmux-app
        run: npm run build

      - name: Stage complete licensed companion generation
        working-directory: winsmux-app
        run: npm run prepare:companion-cli

      - name: Prepare pinned older CLI for native version-pair proof
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File winsmux-app/scripts/prepare-legacy-cli.ps1

      - name: Test Tauri backend
        # cargo test does not launch the dev server. Use the frontend built above
        # so the native WebView exercise reaches the actual app instead of :1420.
        env:
          TAURI_CONFIG: '{"build":{"devUrl":null}}'
        run: cargo test --manifest-path winsmux-app/src-tauri/Cargo.toml

      - name: Build desktop binary without bundling
        working-directory: winsmux-app
        run: npm run tauri -- build --no-bundle
