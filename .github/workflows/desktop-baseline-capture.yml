          Add-Type -TypeDefinition $tokenSource
          $securityProofSource=@'
          using System;
          using System.IO;
          using System.Text;
          using System.Reflection;
          using System.Collections.Generic;
          using System.Security.Cryptography;
          using System.Security.Principal;
          using System.Runtime.InteropServices;
          public static class WinsmuxActorSecurityProofRead {
           [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
           [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr h);
           [DllImport("advapi32.dll",SetLastError=true)] static extern bool OpenProcessToken(IntPtr p,uint a,out IntPtr h);
           const BindingFlags I=BindingFlags.Instance|BindingFlags.Public|BindingFlags.NonPublic;
           static Type Actor(){foreach(var a in AppDomain.CurrentDomain.GetAssemblies()){var t=a.GetType("WinsmuxDesktopActorProbe",false);if(t!=null)return t;}throw new InvalidOperationException("Proof actor source missing");}
