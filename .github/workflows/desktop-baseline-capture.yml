          if(@($e).Count){throw 'explicit_sd_product_parse'}
          $x=@($ast.FindAll({param($n)$n -is [Management.Automation.Language.AssignmentStatementAst] -and $n.Left -is [Management.Automation.Language.VariableExpressionAst] -and $n.Left.VariablePath.UserPath -ceq 'actorCSharp'},$true))
          if($x.Count -ne 1 -or $x[0].Right -isnot [Management.Automation.Language.CommandExpressionAst] -or $x[0].Right.Expression -isnot [Management.Automation.Language.StringConstantExpressionAst] -or $x[0].Right.Expression.StringConstantType -ne [Management.Automation.Language.StringConstantType]::SingleQuotedHereString){throw 'explicit_sd_actor_literal'}
          $actorSource=[string]$x[0].Right.Expression.Value
          Add-Type -TypeDefinition $actorSource
