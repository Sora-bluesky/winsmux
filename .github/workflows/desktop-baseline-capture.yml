           [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr h);
           [DllImport("advapi32.dll",SetLastError=true)] static extern bool OpenProcessToken(IntPtr p,uint a,out IntPtr h);
           [DllImport("advapi32.dll",SetLastError=true)] static extern bool GetTokenInformation(IntPtr t,int c,IntPtr b,uint n,out uint used);
           static IntPtr Info(IntPtr t,int c){uint n;bool ok=GetTokenInformation(t,c,IntPtr.Zero,0,out n);int error=Marshal.GetLastWin32Error();if(ok||error!=122||n<(uint)IntPtr.Size||n>65536)throw new InvalidOperationException("pipe_token_size_"+c+"_"+error);IntPtr p=Marshal.AllocHGlobal((int)n);try{uint actual;if(!GetTokenInformation(t,c,p,n,out actual)||actual!=n)throw new InvalidOperationException("pipe_token_read_"+c+"_"+Marshal.GetLastWin32Error());return p;}catch{Marshal.FreeHGlobal(p);throw;}}
