           }}finally{CloseHandle(h);}}
          }
          '@
          Add-Type -TypeDefinition $securityProofSource
          $callerSecurityBefore=[WinsmuxActorSecurityProofRead]::Read()
          function Invoke-PipeBareCommand {
           param([string]$Image,[string[]]$Arguments,[string]$Stage)
           $row=[ordered]@{stage=$Stage;returned=$false;exit_code=$null;errors=@();stdout_bytes=0;stdout_sha256=$null;stdout_truncated=$false;safe_text=$null;node_spawn=$null}
           $retained=[IO.MemoryStream]::new();$total=0;$global:LASTEXITCODE=$null
           try {
            $PSNativeCommandUseErrorActionPreference=$false
            & $Image @Arguments 2>&1 | ForEach-Object { $part=[Text.Encoding]::UTF8.GetBytes([string]$_+[char]10);$total+=$part.Length;$keep=[Math]::Min($part.Length,16384-[int]$retained.Length);if($keep -gt 0){$retained.Write($part,0,$keep)} }
            $row.returned=$true;$row.exit_code=$global:LASTEXITCODE
           }catch{$row.errors=@(Get-GitDiagnosticErrors $_.Exception)}
           $bytes=$retained.ToArray();$retained.Dispose();$row.stdout_bytes=$total;$row.stdout_truncated=$total -gt 16384;$row.stdout_sha256=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
           $safe=[Text.Encoding]::UTF8.GetString($bytes).Trim()
