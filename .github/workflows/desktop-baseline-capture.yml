           static string SidHash(SecurityIdentifier sid){var b=new byte[sid.BinaryLength];sid.GetBinaryForm(b,0);return Hash(b);}
           static string Role(SecurityIdentifier s,SecurityIdentifier user){if(s.Equals(user))return "current_user";if(s.IsWellKnown(WellKnownSidType.BuiltinAdministratorsSid))return "builtin_administrators";if(s.IsWellKnown(WellKnownSidType.LocalSystemSid))return "local_system";if(s.IsWellKnown(WellKnownSidType.WorldSid))return "everyone";if(s.IsWellKnown(WellKnownSidType.AuthenticatedUserSid))return "authenticated_users";if(s.IsWellKnown(WellKnownSidType.CreatorOwnerSid))return "creator_owner";if(s.IsWellKnown(WellKnownSidType.LogonIdsSid))return "logon_sid";return "other_hashed";}
           public static Dictionary<string,object> Read(){var r=new Dictionary<string,object>();IntPtr t;if(!OpenProcessToken(GetCurrentProcess(),8,out t)){r["opened"]=false;r["winerror"]=Marshal.GetLastWin32Error();return r;}r["opened"]=true;try{IntPtr u=IntPtr.Zero,o=IntPtr.Zero,d=IntPtr.Zero;try{u=Info(t,1);o=Info(t,4);d=Info(t,6);var user=new SecurityIdentifier(Marshal.ReadIntPtr(u));var owner=new SecurityIdentifier(Marshal.ReadIntPtr(o));r["user_sid_sha256"]=SidHash(user);r["owner"]=new Dictionary<string,object>{{"role",Role(owner,user)},{"sid_sha256",SidHash(owner)}};IntPtr p=Marshal.ReadIntPtr(d);r["default_dacl_null"]=p==IntPtr.Zero;if(p!=IntPtr.Zero){int length=(ushort)Marshal.ReadInt16(p,2);if(length<8||length>65535)throw new InvalidOperationException("pipe_dacl_length");byte[] b=new byte[length];Marshal.Copy(p,b,0,length);var acl=new RawAcl(b,0);r["default_dacl_sha256"]=Hash(b);r["default_dacl_bytes"]=length;r["ace_count"]=acl.Count;var rows=new List<Dictionary<string,object>>();for(int i=0;i<Math.Min(acl.Count,16);i++){var ace=acl[i];byte[] aceBytes=new byte[ace.BinaryLength];ace.GetBinaryForm(aceBytes,0);var row=new Dictionary<string,object>{{"type",(int)ace.AceType},{"flags",(int)ace.AceFlags},{"ace_sha256",Hash(aceBytes)}};var q=ace as QualifiedAce;if(q!=null){row["qualifier"]=(int)q.AceQualifier;row["mask"]=unchecked((uint)q.AccessMask);row["sid_role"]=Role(q.SecurityIdentifier,user);row["sid_sha256"]=SidHash(q.SecurityIdentifier);}else{byte[] raw=new byte[ace.BinaryLength];ace.GetBinaryForm(raw,0);row["unclassified_ace_sha256"]=Hash(raw);}rows.Add(row);}r["aces"]=rows;r["aces_truncated"]=acl.Count>16;}return r;}finally{foreach(var p in new[]{u,o,d})if(p!=IntPtr.Zero)Marshal.FreeHGlobal(p);}}finally{r["token_closed"]=CloseHandle(t);}}
