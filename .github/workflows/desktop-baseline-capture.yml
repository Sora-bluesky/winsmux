          if($bytes.Length -gt 16384){throw 'explicit_sd_final_receipt_bound'}
          $output=Join-Path $env:RUNNER_TEMP ('winsmux-actor-receipt-'+$env:GITHUB_RUN_ID+'.'+$env:GITHUB_RUN_ATTEMPT+'.'+$caller+'.json')
          $file=[IO.FileStream]::new($output,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try{$file.Write($bytes,0,$bytes.Length);$file.Flush($true)}finally{$file.Dispose()}
          $json
          if(-not $passed){exit 1}
      - name: Preserve only the explicit restrictive SD proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-actor-${{ github.sha }}
          path: ${{ runner.temp }}/winsmux-actor-receipt-${{ github.run_id }}.${{ github.run_attempt }}.${{ github.sha }}.json
          if-no-files-found: error
