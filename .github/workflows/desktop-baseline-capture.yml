            var enabled=new List<string>();foreach(var p in (Array)Get(snapshot,"privileges"))if(((uint)Get(p,"attributes")&2)!=0)enabled.Add(Hash(Encoding.UTF8.GetBytes(Get(p,"low")+":"+Get(p,"high"))));enabled.Sort(StringComparer.Ordinal);
            var admin=new SecurityIdentifier(WellKnownSidType.BuiltinAdministratorsSid,null);var bytes=new byte[admin.BinaryLength];admin.GetBinaryForm(bytes,0);int admins=0;bool deny=true;foreach(var g in (Array)Get(snapshot,"groups"))if(Convert.ToBase64String((byte[])Get(g,"sid"))==Convert.ToBase64String(bytes)){admins++;uint attrs=(uint)Get(g,"attributes");deny=deny&&(attrs&0x10)!=0&&(attrs&6)==0;}
