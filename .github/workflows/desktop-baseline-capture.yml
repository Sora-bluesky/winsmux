          function Hash-SdFile([string]$Path){return (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()}
          $sourceSha=Hash-SdFile $sourcePath
          if($sourceSha -cnotin @('03f583645d052cb660a5e672b7fd8237bc52b4bc22b5f6bda67b328b8408c5bc','9e9be1cb74d20c0180e54cb5e8445bf8b4f5aa4f3dcc8303838a772b3f3fcce3')){throw 'explicit_sd_product_source_changed'}
