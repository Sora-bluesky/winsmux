# Pre-release gate for an unpublished Tauri desktop candidate.
# Leg A (default off): proves no CDP debugging port opens when gate vars are unset.
# Leg B (gated on): proves public-release smoke observes a working CDP endpoint via
# the app-side injection path (legacy env port channel stripped with MarkerOnly).
#
# Note: Leg A's History / Code Cache checks under EBWebView/Default are an observed
# invariant from a dev-machine run and are used only as a launch-integrity signal,
# not as independent proof that navigation occurred. Leg B's evidence.page_url
# assertion is what proves a page actually loaded.

name: desktop-candidate-cdp-gate

on:
  workflow_call:
    inputs:
      candidate_ref:
        required: true
        type: string
      release_tag:
        required: false
        default: v0.38.0
        type: string
      version:
        required: false
        default: 0.38.0
        type: string
      native_lifecycle:
        required: true
        type: boolean
      baseline_artifact:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate commit SHA
        required: true
        type: string
      release_tag:
        description: Release tag for smoke helper
        required: false
        default: v0.38.0
        type: string
      version:
        description: Version for smoke helper
        required: false
        default: 0.38.0
        type: string
      native_lifecycle:
        description: Finite native install/update/rollback/uninstall proof
        required: false
        default: false
        type: boolean
      baseline_artifact:
        description: Same-run fixed ja baseline artifact (native mode only)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  desktop-candidate-cdp-gate:
    if: ${{ !inputs.native_lifecycle }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate candidate commit SHA
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          $candidate = $env:CANDIDATE_REF
          if ($candidate -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid candidate_ref '$candidate': expected a full 40-character hexadecimal commit SHA."
          }
          Write-Host 'candidate_ref accepted as a full commit SHA'

      - name: Checkout candidate ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false

      - name: Validate checked-out candidate release identity
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $candidate = [string]$env:CANDIDATE_REF
          $releaseTag = [string]$env:RELEASE_TAG
          $version = [string]$env:VERSION_INPUT
          $checkedOutVersion = (Get-Content -LiteralPath 'VERSION' -Raw -Encoding UTF8).Trim()
          if ($checkedOutVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Checked-out VERSION is not a stable product version (value='$checkedOutVersion')."
          }

          $resolvedCommit = (& git rev-parse HEAD 2>$null | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $resolvedCommit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve checked-out HEAD as a full commit SHA (value='$resolvedCommit')."
          }
          if (-not [string]::Equals($resolvedCommit, $candidate, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Checked-out HEAD '$resolvedCommit' does not match candidate_ref '$candidate'."
          }

          $expectedReleaseTag = "v$checkedOutVersion"
          if ($version -cne $checkedOutVersion) {
            throw "Input version '$version' does not match checked-out VERSION '$checkedOutVersion'."
          }
          if ($releaseTag -cne $expectedReleaseTag) {
            throw "Input release_tag '$releaseTag' does not match checked-out VERSION tag '$expectedReleaseTag'."
          }
          Write-Host "candidate identity accepted: commit=$resolvedCommit version=$checkedOutVersion release_tag=$releaseTag"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json

      - uses: ./.github/actions/setup-windows-distribution-toolchain

      - name: Install frontend dependencies
        working-directory: winsmux-app
        run: npm ci

      - name: Build frontend
        working-directory: winsmux-app
        run: npm run build

      - name: Stage companion CLI sidecar
        working-directory: winsmux-app
        run: npm run prepare:companion-cli

      - name: Run gate decision-table unit tests
        run: cargo test --manifest-path winsmux-app/src-tauri/Cargo.toml

      - name: Build Tauri desktop app
        working-directory: winsmux-app
        run: npm run tauri -- build

      - name: "Leg A - default off (no CDP port)"
        id: leg_a
        run: |
          $ErrorActionPreference = 'Stop'

          $userData = Join-Path ([System.IO.Path]::GetTempPath()) ("winsmux-cdp-gate-a-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $userData -Force | Out-Null

          $appPath = Join-Path $PWD 'target/release/winsmux-app.exe'
          if (-not (Test-Path -LiteralPath $appPath)) {
            throw "Leg A failed: app binary missing at $appPath"
          }

          $appProc = $null
          $ownedWebViewPids = @()

          try {
            Remove-Item Env:WINSMUX_DESKTOP_TEST_PROFILE -ErrorAction SilentlyContinue
            Remove-Item Env:WINSMUX_DESKTOP_REMOTE_DEBUG_PORT -ErrorAction SilentlyContinue

            $env:WEBVIEW2_USER_DATA_FOLDER = $userData

            $appProc = Start-Process -FilePath $appPath -PassThru
            Start-Sleep -Seconds 35
            $appProc.Refresh()

            # P1: app process has not exited
            if ($appProc.HasExited) {
              throw "Leg A failed P1: app process exited (exit code $($appProc.ExitCode))"
            }
            Write-Host "P1 PASS: app process still running (PID $($appProc.Id))"

            # P2: owned msedgewebview2.exe bound to temp user-data folder
            $userDataNeedle = $userData
            $ownedWebViews = Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" |
              Where-Object { $_.CommandLine -and $_.CommandLine.Contains($userDataNeedle) }
            if (-not $ownedWebViews -or @($ownedWebViews).Count -lt 1) {
              throw "Leg A failed P2: no msedgewebview2.exe with command line containing user-data folder $userData"
            }
            $ownedWebViewPids = @($ownedWebViews | ForEach-Object { $_.ProcessId })
            Write-Host "P2 PASS: owned msedgewebview2 count=$(@($ownedWebViews).Count) pids=$($ownedWebViewPids -join ',')"

            # P3: EBWebView directory exists
            $ebWebView = Join-Path $userData 'EBWebView'
            if (-not (Test-Path -LiteralPath $ebWebView)) {
              throw "Leg A failed P3: EBWebView directory missing under $userData"
            }
            Write-Host "P3 PASS: EBWebView exists at $ebWebView"

            # P4: MainWindowHandle non-zero; History and Code Cache under EBWebView/Default
            if ($appProc.MainWindowHandle -eq [IntPtr]::Zero) {
              throw "Leg A failed P4: MainWindowHandle is zero"
            }
            $defaultDir = Join-Path $ebWebView 'Default'
            $historyPath = Join-Path $defaultDir 'History'
            $codeCachePath = Join-Path $defaultDir 'Code Cache'
            if (-not (Test-Path -LiteralPath $historyPath)) {
              throw "Leg A failed P4: History missing under EBWebView/Default"
            }
            if (-not (Test-Path -LiteralPath $codeCachePath)) {
              throw "Leg A failed P4: Code Cache missing under EBWebView/Default"
            }
            Write-Host "P4 PASS: MainWindowHandle=$($appProc.MainWindowHandle); History and Code Cache present"

            # Absence: no --remote-debugging-port among owned webview processes
            $rdpHits = @($ownedWebViews | Where-Object { $_.CommandLine -match '--remote-debugging-port' })
            if ($rdpHits.Count -gt 0) {
              throw "Leg A failed absence: owned msedgewebview2 command line contains --remote-debugging-port"
            }
            Write-Host "ABSENCE PASS: no --remote-debugging-port in owned webview command lines"

            # Absence: DevToolsActivePort must not exist
            $devToolsPort = Join-Path $ebWebView 'DevToolsActivePort'
            if (Test-Path -LiteralPath $devToolsPort) {
              throw "Leg A failed absence: DevToolsActivePort exists at $devToolsPort"
            }
            Write-Host "ABSENCE PASS: DevToolsActivePort does not exist"

            Write-Host "LEG_A_OUTCOME=PASS"
          }
          finally {
            foreach ($webViewPid in $ownedWebViewPids) {
              try {
                Stop-Process -Id $webViewPid -Force -ErrorAction SilentlyContinue
              } catch {}
            }
            if ($null -ne $appProc -and -not $appProc.HasExited) {
              try {
                Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue
              } catch {}
            }
            if (Test-Path -LiteralPath $userData) {
              try {
                Remove-Item -LiteralPath $userData -Recurse -Force -ErrorAction SilentlyContinue
              } catch {}
            }
            Remove-Item Env:WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue
          }

      - name: "Leg B - gated on (API path only)"
        id: leg_b
        run: |
          $ErrorActionPreference = 'Stop'

          $version = '${{ inputs.version }}'
          $releaseTag = '${{ inputs.release_tag }}'
          $checkedOutVersion = (Get-Content -LiteralPath 'VERSION' -Raw -Encoding UTF8).Trim()
          $installer = Join-Path 'target/release/bundle/nsis' "winsmux_$($checkedOutVersion)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Leg B failed: installer missing at $installer"
          }
          . ./scripts/desktop-install-inventory.ps1
          $inventoryPath = Join-Path $env:RUNNER_TEMP "winsmux_${version}_x64-setup.inventory.json"
          New-DesktopInstallInventory -RepositoryRoot $env:GITHUB_WORKSPACE -InstallerPath $installer -OutputPath $inventoryPath | Out-Null
          $inventoryHash = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceCommit = (& git rev-parse HEAD | Out-String).Trim().ToLowerInvariant()

          $stdoutPath = Join-Path $env:RUNNER_TEMP 'leg-b-stdout.txt'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'leg-b-stderr.txt'
          if (Test-Path -LiteralPath $stdoutPath) { Remove-Item -LiteralPath $stdoutPath -Force }
          if (Test-Path -LiteralPath $stderrPath) { Remove-Item -LiteralPath $stderrPath -Force }

          $proc = Start-Process -FilePath 'pwsh' -ArgumentList @(
            '-NoProfile',
            '-File', 'scripts/test-public-release.ps1',
            '-Surface', 'Desktop',
            '-Version', $version,
            '-ReleaseTag', $releaseTag,
            '-Repository', '${{ github.repository }}',
            '-CandidateInstallerPath', $installer,
            '-DesktopInventoryPath', $inventoryPath,
            '-DesktopLegacyEnvMode', 'MarkerOnly',
            '-Json'
          ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath

          $raw = ''
          if (Test-Path -LiteralPath $stdoutPath) {
            $raw = [System.IO.File]::ReadAllText($stdoutPath)
          }
          $raw = $raw -replace "`r`n", "`n" -replace "`r", "`n"
          $rawTrim = $raw.TrimEnd("`n")

          if ($proc.ExitCode -ne 0) {
            # Raw child output can contain private discovery/browser data. Publish only the safe failure receipt.
            try {
              $failure = $rawTrim | ConvertFrom-Json -Depth 12
              Assert-DesktopInventoryShape $failure @('schema', 'ok', 'surface', 'version', 'release_tag', 'stage', 'reason_code', 'helper_exit_code', 'native_exit_code', 'stdout_bytes', 'stderr_bytes', 'observation_state', 'operation_failure', 'cleanup_failure', 'cleanup_stage', 'cleanup')
              if ($failure.schema -cne 'winsmux-desktop-smoke-failure/v1') { throw 'unexpected receipt' }
              $failure | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'desktop-helper-failure.json') -Encoding utf8
            } catch { Write-Host 'Desktop helper failure receipt unavailable.' }
            throw "Leg B failed: helper exit code $($proc.ExitCode)."
          }
          Write-Host "LEG_B_EXIT PASS: exit code 0"

          $lines = @($rawTrim -split "`n" | ForEach-Object { $_.TrimEnd() } | Where-Object { $_ -ne '' })
          if ($lines.Count -ne 1) {
            throw "Leg B failed: expected exactly one non-empty stdout line, got $($lines.Count)."
          }
          Write-Host "LEG_B_STDOUT_LINES PASS: exactly one non-empty line"

          try {
            $json = $lines[0] | ConvertFrom-Json
          } catch {
            throw 'Leg B failed: stdout line is not valid JSON.'
          }
          Write-Host "LEG_B_JSON PASS: stdout parses as JSON"
          Assert-DesktopInstallReceipt -Receipt $json -Version $version -InstallerSha256 $installerHash -SourceCommit $sourceCommit -InventorySha256 $inventoryHash | Out-Null

          if ($json.ok -ne $true) {
            throw "Leg B failed: ok is not true (value=$($json.ok))"
          }
          Write-Host "LEG_B_OK PASS: ok=true"

          if ("$($json.cleanup)" -ne 'clean') {
            throw "Leg B failed: cleanup is not 'clean' (value=$($json.cleanup))"
          }
          Write-Host "LEG_B_CLEANUP PASS: cleanup=clean"

          $pageUrl = $null
          if ($null -ne $json.evidence -and $null -ne $json.evidence.page_url) {
            $pageUrl = [string]$json.evidence.page_url
          }
          if ([string]::IsNullOrEmpty($pageUrl)) {
            throw "Leg B failed: evidence.page_url missing or empty"
          }
          if ($pageUrl -notmatch '^(?:tauri://localhost|https?://tauri\.localhost)(?:/|$)') {
            throw "Leg B failed: evidence.page_url does not match expected pattern (value=$pageUrl)"
          }
          Write-Host "LEG_B_PAGE_URL PASS: evidence.page_url=$pageUrl"
          Write-Host "LEG_B_OUTCOME=PASS"

          "page_url=$pageUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write gate receipt to step summary
        if: always()
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          PAGE_URL: ${{ steps.leg_b.outputs.page_url }}
          LEG_A_OUTCOME: ${{ steps.leg_a.outcome }}
          LEG_B_OUTCOME: ${{ steps.leg_b.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = $env:CANDIDATE_REF
          $resolvedCommit = (& git rev-parse HEAD 2>$null | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $resolvedCommit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Unable to resolve checked-out HEAD as a full 40-character commit SHA (value='$resolvedCommit')."
          }
          $pageUrl = $env:PAGE_URL
          if ([string]::IsNullOrEmpty($pageUrl)) { $pageUrl = 'n/a' }
          $legAOutcome = $env:LEG_A_OUTCOME
          $legBOutcome = $env:LEG_B_OUTCOME
          $line = "desktop-candidate-cdp-gate candidate_ref=$candidate resolved_commit=$resolvedCommit leg_a=$legAOutcome leg_b=$legBOutcome evidence.page_url=$pageUrl"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line
          Write-Host $line
          $failurePath = Join-Path $env:RUNNER_TEMP 'desktop-helper-failure.json'
          if (Test-Path -LiteralPath $failurePath -PathType Leaf) {
            . ./scripts/desktop-install-inventory.ps1
            $failure = Read-DesktopStrictJson $failurePath
            Assert-DesktopInventoryShape $failure @('schema', 'ok', 'surface', 'version', 'release_tag', 'stage', 'reason_code', 'helper_exit_code', 'native_exit_code', 'stdout_bytes', 'stderr_bytes', 'observation_state', 'operation_failure', 'cleanup_failure', 'cleanup_stage', 'cleanup')
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($failure | ConvertTo-Json -Compress)
          }

  desktop-native-lifecycle:
    if: github.repository == 'Sora-bluesky/winsmux' && inputs.native_lifecycle
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        format: ${{ fromJSON(github.ref == 'refs/heads/codex/task880-native-lifecycle' && '["NSIS"]' || '["MSI","NSIS"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Admit only the same caller and fixed native release
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact }}
        run: |
          $source = [string]$env:CANDIDATE_REF
          if ($source -cnotmatch '^[a-f0-9]{40}$' -or $source -cne $env:GITHUB_SHA -or $env:VERSION_INPUT -cne '0.38.0' -or $env:RELEASE_TAG -cne 'v0.38.0' -or $env:BASELINE_ARTIFACT -cne ('desktop-baseline-ja-root-' + $source)) { throw 'Native caller/release/baseline identity refused.' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - name: Bind actual source and isolated build namespaces
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          $source = (& git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA -or (Get-Content -LiteralPath VERSION -Raw -Encoding UTF8).Trim() -cne '0.38.0') { throw 'Native checkout differs from caller.' }
          $root = Join-Path $env:RUNNER_TEMP ('winsmux-native-input-' + $env:GITHUB_RUN_ID + '.' + $env:GITHUB_RUN_ATTEMPT + '.' + $source + '.' + $env:FORMAT)
          if (Test-Path -LiteralPath $root) { throw 'Native namespace already exists.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($name in @('sdk-temp', 'build', 'candidate', 'baseline')) { New-Item -ItemType Directory -Path (Join-Path $root $name) | Out-Null }
          'WINSMUX_NATIVE_INPUT_ROOT=' + $root | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'TEMP=' + (Join-Path $root 'sdk-temp') | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'TMP=' + (Join-Path $root 'sdk-temp') | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'CARGO_TARGET_DIR=' + (Join-Path $root 'build') | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: winsmux-app/package-lock.json
      - uses: ./.github/actions/setup-windows-distribution-toolchain
      - name: Install frontend build inputs
        working-directory: winsmux-app
        run: npm ci
      - name: Build the same native candidate with standard Tauri CRT settings
        working-directory: winsmux-app
        env:
          STATIC_VCRUNTIME: 'true'
        run: npm run tauri -- build
      - name: Freeze and verify the same-job native candidate transport
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          $tokens = $null; $errors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/test-public-release.ps1'), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Native source parse refused.' }
          $functions = @($ast.FindAll({ param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -ceq 'Get-DesktopNativeTransportModule' }, $false))
          if ($functions.Count -ne 1) { throw 'Native transport module definition refused.' }
          . ([scriptblock]::Create($functions[0].Extent.Text))
          $module = Get-DesktopNativeTransportModule
          & node --input-type=module --eval $module create $env:GITHUB_SHA $env:FORMAT $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Native transport publication refused.' }
      - name: Build private result-only NSIS observer
        if: github.ref == 'refs/heads/codex/task880-native-lifecycle'
        run: |
          & node ./scripts/desktop-native-nsis-observer.mjs compile $env:GITHUB_SHA $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'NSIS diagnostic build refused.' }
      - name: Obtain the same-run fixed baseline artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.baseline_artifact }}
          path: ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/baseline
      - name: Obtain only the approved baseline capture source
        uses: actions/checkout@v6
        with:
          ref: 0eaed56da31826b48fc153293c9407ec49547c91
          path: .native-baseline-source
          persist-credentials: false
      - name: Execute the finite native lifecycle
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          & ./scripts/test-public-release.ps1 -Surface Desktop -Version 0.38.0 -ReleaseTag v0.38.0 -Repository Sora-bluesky/winsmux -DesktopNativeLifecycle -DesktopNativeFormat $env:FORMAT -DesktopNativeSourceCommit $env:GITHUB_SHA -DesktopNativeCandidateDirectory (Join-Path $env:WINSMUX_NATIVE_INPUT_ROOT 'candidate') -DesktopNativeBaselineDirectory (Join-Path $env:WINSMUX_NATIVE_INPUT_ROOT 'baseline') -Json
          if ($LASTEXITCODE -ne 0) { throw 'Native lifecycle failed or has an unmet class.' }
      - name: Collect sanitized result-only NSIS observation
        if: always() && github.ref == 'refs/heads/codex/task880-native-lifecycle'
        run: |
          & node ./scripts/desktop-native-nsis-observer.mjs collect $env:GITHUB_SHA $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'NSIS diagnostic collection refused.' }
      - name: Preserve only individual sanitized NSIS diagnostic files
        if: always() && github.ref == 'refs/heads/codex/task880-native-lifecycle'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-nsis-observer-${{ github.sha }}
          path: |
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/evidence/nsis-observer-build.json
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/evidence/nsis-actual-callee-observer.json
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/evidence/nsis-observer-before.json
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/evidence/nsis-observer-after.json
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/evidence/nsis-observer-update-process.json
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/evidence/nsis-observer-uninstall-process.json
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/candidate/desktop-native-candidate.json
          if-no-files-found: error
      - name: Preserve bounded native lifecycle evidence
        if: always() && github.ref != 'refs/heads/codex/task880-native-lifecycle'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-lifecycle-${{ matrix.format }}-${{ github.sha }}
          path: |
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/evidence/**/*.json
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/evidence/vhd-owned-*/ownership.jsonl
            ${{ env.WINSMUX_NATIVE_INPUT_ROOT }}/candidate/desktop-native-candidate.json
          if-no-files-found: error
