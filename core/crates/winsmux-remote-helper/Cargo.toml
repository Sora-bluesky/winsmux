[package]
name = "winsmux-remote-helper"
version = "0.36.37"
edition = "2021"
publish = false
license = "Apache-2.0 AND MIT"
description = "stdio remote-helper protocol and Linux PTY broker for winsmux"

[[bin]]
name = "winsmux-remote-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.183"
